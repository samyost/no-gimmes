/* ---- tokens: High Noon (light, default) ---- */
:root{
  --bone:#F5F0E4; --card:#FCF8EF; --ink:#16211B; --sage:#5C6A5E; --pencil:#C9BFA9;
  --red:#C2273D; --red-press:#9E1F31; --red-wash:#FAE7EA;
  --blue:#2158C7; --blue-press:#1A46A0; --blue-wash:#E8EFFA;
  --sagebrush:#77806F; --brass:#8C6A1F; --warn:#95660A; --live:#2E6B3C; --ob:#7A1F1F;
  --cream:#FCF8EF; --scrim:rgba(22,33,27,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bone:#0F1713; --card:#1B231E; --ink:#EFE9DA; --sage:#9AA69C; --pencil:#39443C;
    --red:#FF5F70; --red-press:#D94756; --red-wash:#3A1B21;
    --blue:#7AA5FF; --blue-press:#5E86DD; --blue-wash:#17263F;
    --sagebrush:#8B968B; --brass:#D9B45B; --warn:#E5A93D; --live:#5FBF77; --ob:#E4756F;
    --cream:#10160f; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bone:#0F1713; --card:#1B231E; --ink:#EFE9DA; --sage:#9AA69C; --pencil:#39443C;
  --red:#FF5F70; --red-press:#D94756; --red-wash:#3A1B21;
  --blue:#7AA5FF; --blue-press:#5E86DD; --blue-wash:#17263F;
  --sagebrush:#8B968B; --brass:#D9B45B; --warn:#E5A93D; --live:#5FBF77; --ob:#E4756F;
  --cream:#10160f; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bone);color:var(--ink);
  font:16px/1.45 'Atkinson Hyperlegible','Helvetica Neue',system-ui,sans-serif;
  min-height:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
.sc{font-family:'Saira Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums lining-nums}
.num{font-variant-numeric:tabular-nums lining-nums}
#app{max-width:560px;margin:0 auto;padding-bottom:40px}
.mut{color:var(--sage)}
.brass{color:var(--brass)}
.caps{text-transform:uppercase;letter-spacing:.04em}
a{color:var(--brass)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- app bar ---- */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  height:46px;padding:0 12px;background:var(--bone);border-bottom:1px solid var(--pencil)}
.wordmark{font-family:'Saira Condensed';font-weight:800;font-size:17px;letter-spacing:.06em;
  border-bottom:2px solid var(--brass);padding-bottom:1px}
.appbar .sp{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--card);border:2px solid var(--sagebrush)}
.avatar.red{border-color:var(--red)} .avatar.blue{border-color:var(--blue)}
.backbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-left:-10px}

/* ---- sync pill ---- */
.pill{font-family:'Saira Condensed';font-weight:700;font-size:11.5px;letter-spacing:.05em;
  padding:4px 9px;border-radius:99px;border:1px solid var(--pencil);background:var(--card);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.pill.q{color:var(--warn);border-color:var(--warn)} .pill.q .dot{background:var(--warn)}
.pill.rm{color:var(--brass);border-color:var(--brass)} .pill.rm .dot{background:var(--brass)}
.pill.sy .dot{background:var(--sage);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---- cup header ---- */
.cuphead{position:sticky;top:46px;z-index:29;background:var(--bone);padding:8px 14px 6px;border-bottom:1px solid var(--pencil);cursor:pointer}
.cupline{display:flex;align-items:baseline;justify-content:center;gap:12px}
.cupline .tn{font-family:'Saira Condensed';font-weight:700;font-size:15px;letter-spacing:.08em}
.cupline .pts{font-family:'Saira Condensed';font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.cupline .dash{font-family:'Saira Condensed';font-weight:600;font-size:26px;color:var(--sage)}
.tRed{color:var(--red)} .tBlue{color:var(--blue)}
.frac{font-size:.6em;vertical-align:.25em}
.tug{position:relative;height:12px;border-radius:6px;border:1px solid var(--pencil);background:var(--bone);margin:7px 0 4px;overflow:visible}
.tug .seg{position:absolute;top:0;bottom:0}
.tug .aR{left:0;background:var(--red);border-radius:5px 0 0 5px;transition:width .4s ease-out}
.tug .aB{right:0;background:var(--blue);border-radius:0 5px 5px 0;transition:width .4s ease-out}
.tug .pR{background:repeating-linear-gradient(45deg,var(--red) 0 4px,transparent 4px 8px);opacity:.55}
.tug .pB{background:repeating-linear-gradient(45deg,var(--blue) 0 4px,transparent 4px 8px);opacity:.55}
.tug .tick{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--brass)}
.tug .tick.retain{top:0;bottom:0;width:2px;opacity:.8}
.ticklab{position:absolute;top:-16px;transform:translateX(-50%);font-family:'Saira Condensed';font-weight:700;font-size:11px;color:var(--brass)}
.cupsub{text-align:center;font-size:11px;color:var(--sage)}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 0 0 0 transparent}}
.ticked{animation:tick .2s ease-out}
@keyframes tick{50%{transform:scale(1.12)}}
/* condensed cup strip */
.cupstrip{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:38px;
  padding:0 10px;background:var(--bone);border-bottom:1px solid var(--pencil)}
.cupstrip .mini{font-family:'Saira Condensed';font-weight:800;font-size:16px}
.cupstrip .tug{flex:1;height:5px;margin:0;border-radius:3px}

/* ---- day tabs ---- */
.daytabs{position:sticky;top:calc(46px + var(--cuph,97px));z-index:28;display:flex;background:var(--bone);border-bottom:1px solid var(--pencil)}
.dt{flex:1;padding:6px 0 5px;text-align:center;border-bottom:3px solid transparent}
.dt .d1{font-family:'Saira Condensed';font-weight:700;font-size:15px;letter-spacing:.05em}
.dt .d2{font-size:10px;color:var(--sage);display:flex;align-items:center;justify-content:center;gap:4px}
.dt.on{border-bottom-color:var(--brass)}
.dt .ring{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--brass)}
.dt .win{display:inline-block;width:7px;height:7px;border-radius:50%}
.dt .win.red{background:var(--red)} .dt .win.blue{background:var(--blue)}
.dt .win.split{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}

/* ---- day context ---- */
.ctx{padding:10px 14px 8px;display:flex;align-items:flex-start;gap:8px}
.ctx .c1{font-weight:700;font-size:16px}
.ctx .c1 .tbd{color:var(--brass);text-decoration:underline;text-underline-offset:3px}
.ctx .chips{margin-top:3px;display:flex;flex-wrap:wrap;gap:5px}
.rchip{font-family:'Saira Condensed';font-weight:600;font-size:11px;letter-spacing:.05em;
  padding:2px 7px;border:1px solid var(--pencil);border-radius:99px;color:var(--sage);text-transform:uppercase}
.ctx .sp{flex:1}
.daysub{font-family:'Saira Condensed';font-weight:700;font-size:13px;white-space:nowrap}
.gear{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin:-8px -8px 0 0}

/* ---- tee groups & match rows ---- */
.tgh{padding:12px 14px 4px;font-family:'Saira Condensed';font-weight:600;font-size:12.5px;
  letter-spacing:.05em;color:var(--sage);text-transform:uppercase;border-bottom:1px solid var(--pencil);margin:0 0 8px}
.mlist{padding:0 10px;display:flex;flex-direction:column;gap:8px}
.mrow{position:relative;display:block;width:100%;text-align:inherit;background:var(--card);
  border:1px solid var(--pencil);border-radius:12px;padding:10px 12px 8px}
.mrow .top{display:flex;align-items:center;gap:6px}
.mside{flex:1;min-width:0}
.mside .pl{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mside.lead .pl{font-weight:800}
.mside.R .pl{color:var(--red)} .mside.B .pl{color:var(--blue);text-align:right}
.mcent{flex:0 0 auto;text-align:center;min-width:64px}
.you{font-family:'Saira Condensed';font-weight:700;font-size:10px;color:var(--brass);letter-spacing:.1em}
.thru{font-size:11.5px;color:var(--sage);margin-top:2px}
.thru .stale{color:var(--warn)}
.ptlab{position:absolute;right:4px;top:50%;transform:translateY(-50%) rotate(90deg);
  font-family:'Saira Condensed';font-weight:600;font-size:9.5px;color:var(--sage);letter-spacing:.1em}
.subline{font-size:12px;color:var(--sage);margin-top:3px}
.holestrip{display:flex;gap:2px;margin-top:7px}
.hs{width:100%;max-width:8px;height:6px;border:1px solid var(--pencil);border-radius:1.5px;background:transparent;position:relative;flex:1}
.hs.A{background:var(--red);border-color:var(--red)} .hs.B{background:var(--blue);border-color:var(--blue)}
.hs.H{background:var(--sagebrush);border-color:var(--sagebrush)}
.hs.x{opacity:.4}
.hs.ov::after{content:'';position:absolute;right:0;top:0;border-style:solid;border-width:0 3px 3px 0;border-color:transparent var(--cream) transparent transparent}
.glow{animation:glowp 2s ease-out}
@keyframes glowp{0%{background-color:var(--red-wash)}100%{background-color:var(--card)}}
.glowB{animation:glowb 2s ease-out}
@keyframes glowb{0%{background-color:var(--blue-wash)}100%{background-color:var(--card)}}
.badge{font-family:'Saira Condensed';font-weight:700;font-size:10px;padding:1px 6px;border:1px solid var(--sage);
  color:var(--sage);border-radius:4px;letter-spacing:.06em}
.dayfoot{padding:12px 14px;font-size:13.5px;color:var(--sage)}
.empty{padding:28px 20px;text-align:center;color:var(--sage);font-size:15px}
.cta{display:inline-block;margin-top:12px;font-family:'Saira Condensed';font-weight:700;font-size:15px;
  letter-spacing:.05em;color:var(--cream);background:var(--ink);border-radius:10px;padding:12px 20px;text-transform:uppercase}
:root[data-theme="dark"] .cta{color:var(--bone)}

/* ---- status chips ---- */
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:'Saira Condensed';
  font-weight:700;letter-spacing:.03em;border-radius:6px;padding:3px 10px;font-size:15px;min-height:26px;color:var(--cream)}
.chip.R{background:var(--red)} .chip.B{background:var(--blue)}
.chip.as{background:var(--card);border:2px solid var(--ink);color:var(--ink)}
.chip.dormie{border:2px solid var(--brass)}
.chip.fin{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip.halv{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}
.chip.tee{background:var(--card);border:1px solid var(--pencil);color:var(--sage)}
.chip .pre{font-size:11px;margin-right:3px;opacity:.9}

/* ---- match screen ---- */
.mhead{padding:10px 14px 4px;position:relative}
.mhead .pair{display:flex;align-items:baseline;gap:8px}
.mhead .pn{flex:1;font-size:17px;font-weight:700;min-width:0}
.mhead .pn.R{color:var(--red)} .mhead .pn.B{color:var(--blue);text-align:right}
.mhead .vs{color:var(--sage);font-size:13px}
.mmeta{font-size:11px;color:var(--sage);letter-spacing:.05em;text-transform:uppercase;margin-top:3px;display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--pencil)}
.dots i.on{background:var(--ink)}
.ovf{position:absolute;right:6px;top:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sage)}
.bigstat{display:flex;align-items:baseline;padding:2px 14px 8px;gap:10px}
.bigstat .st{font-family:'Saira Condensed';font-weight:800;font-size:42px;line-height:1}
.bigstat .st.R{color:var(--red)} .bigstat .st.B{color:var(--blue)} .bigstat .st.d{color:var(--brass)}
.bigstat .sp{flex:1}
.bigstat .thru{font-size:13px}
.finpanel{margin:0 14px 8px;border-radius:12px;padding:12px;text-align:center;color:var(--cream);
  font-family:'Saira Condensed';font-weight:800;font-size:30px}
.finpanel.R{background:var(--red)} .finpanel.B{background:var(--blue)} .finpanel.H{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}

/* ---- hole rail ---- */
.railwrap{overflow-x:auto;scroll-snap-type:x proximity;border-top:1px solid var(--pencil);border-bottom:1px solid var(--pencil);background:var(--card);-webkit-overflow-scrolling:touch}
.rail{display:flex;min-width:max-content;padding:6px 8px;gap:3px;align-items:stretch}
.cell{scroll-snap-align:center;width:46px;min-width:46px;border-radius:8px;border:1px solid transparent;
  padding:3px 0 0;text-align:center;position:relative}
.cell.cur{border-color:var(--ink);background:var(--bone)}
.cell .hn{font-family:'Saira Condensed';font-weight:700;font-size:14px;line-height:1.1}
.cell .hp{font-size:10px;color:var(--sage)}
.cell .sdots{height:7px;display:flex;justify-content:center;gap:2px;align-items:center}
.cell .sdots i{width:5px;height:5px;border-radius:50%}
.cell .sdots i.r{background:var(--red)} .cell .sdots i.b{background:var(--blue)}
.cell .fill{height:22px;margin:2px 3px 3px;border-radius:5px;border:1px solid var(--pencil);position:relative}
.cell .fill.A{background:var(--red);border-color:var(--red)}
.cell .fill.B{background:var(--blue);border-color:var(--blue)}
.cell .fill.H{background:var(--sagebrush);border-color:var(--sagebrush)}
.cell .fill.x{opacity:.4}
.cell .fill .sg{position:absolute;left:2px;bottom:1px;font-size:8px}
.cell .fill.ov::after{content:'';position:absolute;right:1px;top:1px;border-style:solid;border-width:0 6px 6px 0;border-color:transparent var(--cream) transparent transparent}
.cell.pulse .fill{animation:cellpulse .35s ease-out}
@keyframes cellpulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.ninediv{display:flex;align-items:center;padding:0 4px;font-family:'Saira Condensed';font-weight:700;
  font-size:10px;color:var(--sage);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.1em}
.gline{font-size:11px;color:var(--sage);text-align:center;padding:2px 0;background:var(--card)}

/* ---- hole context + pad ---- */
.hctx{padding:8px 14px 4px}
.hctx .h1{font-family:'Saira Condensed';font-weight:700;font-size:15.5px;letter-spacing:.04em}
.spill{margin-top:4px;border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:700;display:inline-block}
.spill.r{background:var(--red-wash);color:var(--red)}
.spill.b{background:var(--blue-wash);color:var(--blue)}
.junkchips{display:flex;gap:6px;padding:6px 14px 0;flex-wrap:wrap}
.jchip{font-family:'Saira Condensed';font-weight:600;font-size:11.5px;letter-spacing:.06em;
  border:1px dashed var(--sage);color:var(--sage);border-radius:99px;padding:4px 10px;text-transform:uppercase}
.pad{position:sticky;bottom:0;background:var(--bone);border-top:1px solid var(--pencil);
  padding:8px 12px calc(14px + env(safe-area-inset-bottom));margin-top:8px}
.editrib{display:flex;align-items:center;gap:8px;font-family:'Saira Condensed';font-weight:700;
  font-size:12.5px;letter-spacing:.05em;color:var(--brass);padding:0 2px 6px;text-transform:uppercase}
.editrib .sp{flex:1}
.drawerh{width:100%;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Saira Condensed';font-weight:600;font-size:12.5px;letter-spacing:.08em;color:var(--sage);text-transform:uppercase}
.winrow{display:flex;gap:8px;margin:2px 0 8px}
.wbtn{flex:1;height:104px;border-radius:16px;color:#FCF8EF;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px}
.wbtn .wl{font-family:'Saira Condensed';font-weight:800;font-size:24px;letter-spacing:.06em}
.wbtn .wn{font-family:'Saira Condensed';font-weight:600;font-size:11.5px;letter-spacing:.08em;opacity:.92}
.wbtn.R{background:var(--red)} .wbtn.R:active{background:var(--red-press)}
.wbtn.B{background:var(--blue)} .wbtn.B:active{background:var(--blue-press)}
.wbtn.lit{box-shadow:0 0 0 3px var(--brass);animation:lit 1.2s infinite}
@keyframes lit{50%{box-shadow:0 0 0 5px var(--brass)}}
.halvebar{width:100%;height:72px;border-radius:14px;border:2px solid var(--ink);background:var(--card);
  font-family:'Saira Condensed';font-weight:700;font-size:20px;letter-spacing:.14em;color:var(--ink)}
.gutter{width:8px;flex:0 0 8px}
.locked .wbtn,.locked .halvebar,.mini3.locked button{opacity:.6;pointer-events:none}
/* drawer */
.mini3{display:flex;gap:6px;margin:2px 0 8px}
.mini3 button{flex:1;height:52px;border-radius:10px;font-family:'Saira Condensed';font-weight:700;font-size:15px;letter-spacing:.08em;color:#FCF8EF}
.mini3 .mR{background:var(--red)} .mini3 .mB{background:var(--blue)}
.mini3 .mH{background:var(--card);border:2px solid var(--ink);color:var(--ink)}
.mini3 button.lit{box-shadow:0 0 0 3px var(--brass);animation:lit 1.2s infinite}
.dbanner{border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:700;margin-bottom:8px;text-align:center}
.dbanner.r{background:var(--red-wash);color:var(--red)} .dbanner.b{background:var(--blue-wash);color:var(--blue)}
.dbanner.h{background:var(--bone);border:1px solid var(--sagebrush);color:var(--sagebrush)}
.dbanner.w{background:var(--bone);border:1px dashed var(--pencil);color:var(--sage)}
.srow{display:flex;align-items:center;gap:5px;padding:5px 0}
.srow.picked .qnums{opacity:.35}
.srow .who{flex:0 0 72px;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden}
.srow .who.r{color:var(--red)} .srow .who.b{color:var(--blue)}
.srowsub{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:-3px 0 2px;padding-right:2px}
.qnums{display:flex;gap:4px;flex:1;justify-content:flex-end}
.qn{width:38px;height:44px;border-radius:9px;border:1.5px solid var(--pencil);
  font-family:'Saira Condensed';font-weight:700;font-size:19px;color:var(--ink);background:var(--card)}
.qn.ghost{border-style:dashed;color:var(--sage)}
.qn.set.r{background:var(--red);border-color:var(--red);color:#FCF8EF}
.qn.set.b{background:var(--blue);border-color:var(--blue);color:#FCF8EF}
.qn.step{font-size:16px;width:30px}
.netlab{font-size:12px;color:var(--brass);font-weight:700;white-space:nowrap}
.pickup{font-size:12px;color:var(--sage);text-decoration:underline;text-underline-offset:2px}
.padnote{font-size:12.5px;color:var(--sage);text-align:center;padding-top:6px}
.resultcard{border-radius:14px;border:1px solid var(--pencil);background:var(--card);padding:14px;text-align:center}
.resultcard .r1{font-family:'Saira Condensed';font-weight:800;font-size:24px}
.resultcard .links{margin-top:8px;display:flex;justify-content:center;gap:18px;font-size:14px}
.resultcard .links button{color:var(--brass);text-decoration:underline;text-underline-offset:3px}
.funban{border:1px solid var(--brass);color:var(--brass);border-radius:8px;padding:5px 10px;
  font-size:12.5px;text-align:center;margin-bottom:8px;font-weight:700}

/* ---- ledger ---- */
.ledger{padding:8px 14px 90px}
.ledger table{width:100%;border-collapse:collapse;font-size:13px}
.ledger th{font-family:'Saira Condensed';font-weight:600;font-size:11px;color:var(--sage);
  text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:4px 6px;border-bottom:1px solid var(--pencil)}
.ledger td{padding:4px 6px;border-bottom:1px solid var(--pencil)}
.ledger .n{color:var(--sage);font-size:12px}
.wtag{font-family:'Saira Condensed';font-weight:700}
.wtag.A{color:var(--red)} .wtag.B{color:var(--blue)} .wtag.H{color:var(--sagebrush)}

/* ---- sheets, snack, takeover ---- */
#sheetlayer{position:fixed;inset:0;z-index:60;display:none}
#sheetlayer.open{display:block}
#sheetlayer .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--card);
  border-radius:18px 18px 0 0;border-top:1px solid var(--pencil);padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30%)}to{transform:translateY(0)}}
.sheet h3{font-family:'Saira Condensed';font-weight:700;font-size:17px;letter-spacing:.05em;margin:2px 0 10px;text-transform:uppercase}
.sheet .btnrow{display:flex;gap:8px;margin-top:14px}
.bigbtn{flex:1;min-height:52px;border-radius:12px;font-family:'Saira Condensed';font-weight:700;
  font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:8px}
.bigbtn.pri{background:var(--ink);color:var(--bone)}
.bigbtn.red{background:var(--red);color:#FCF8EF} .bigbtn.blue{background:var(--blue);color:#FCF8EF}
.bigbtn.ghost{border:2px solid var(--ink)}
.bigbtn.danger{background:var(--ob);color:#FCF8EF}
#snack{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));z-index:70;display:flex;justify-content:center;pointer-events:none}
.snackin{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bone);
  border-radius:10px;padding:10px 16px;font-size:14.5px;max-width:92%;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.snackin button{color:var(--brass);font-family:'Saira Condensed';font-weight:700;letter-spacing:.08em;font-size:14px}
#takeover{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#takeover.open{display:flex;animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:0}}
#takeover.red{background:var(--red)} #takeover.blue{background:var(--blue)} #takeover.neutral{background:var(--ink)}
#takeover .big{font-family:'Saira Condensed';font-weight:800;font-size:44px;color:#FCF8EF;line-height:1.1;text-wrap:balance}
#takeover .sub{color:#FCF8EF;opacity:.92;margin-top:10px;font-size:17px}
#takeover .cont{margin-top:26px;border:2px solid #FCF8EF;color:#FCF8EF;border-radius:10px;padding:12px 26px;
  font-family:'Saira Condensed';font-weight:700;font-size:16px;letter-spacing:.08em}

/* ---- who-are-you ---- */
.whowrap{position:fixed;inset:0;z-index:50;background:var(--bone);overflow-y:auto;padding:26px 18px calc(20px + env(safe-area-inset-bottom))}
.whowrap .wm{text-align:center}
.whowrap h1{font-family:'Saira Condensed';font-weight:800;font-size:30px;text-align:center;margin:14px 0 4px;letter-spacing:.03em}
.whosub{text-align:center;color:var(--sage);font-size:14px;margin-bottom:18px}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
.whocard{background:var(--card);border:1px solid var(--pencil);border-radius:14px;padding:14px 8px 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.whocard .em{font-size:38px;line-height:1.15}
.whocard .nm{font-size:17px;font-weight:700;padding-bottom:10px}
.whocard .bar{align-self:stretch;height:6px;background:var(--sagebrush)}
.whocard .bar.red{background:var(--red)} .whocard .bar.blue{background:var(--blue)}
.whofoot{text-align:center;margin-top:20px}
.whofoot button{color:var(--sage);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---- setup ---- */
.spage{padding:0 14px 60px}
.spage h2{font-family:'Saira Condensed';font-weight:700;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.spage h2 .ct{color:var(--sage);font-weight:600;font-size:13px;letter-spacing:.04em}
.block{background:var(--card);border:1px solid var(--pencil);border-radius:12px;padding:12px}
.pchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:10px;border:1.5px solid var(--pencil);
  background:var(--bone);padding:4px 10px;font-weight:700;font-size:15px;text-align:left}
.pchip .em{font-size:20px}
.pchip.out{opacity:.5} .pchip.out .nm{text-decoration:line-through}
.pchip.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.pchip.redx{border-color:var(--red);background:var(--red-wash)}
.pchip.bluex{border-color:var(--blue);background:var(--blue-wash)}
.teamcols{display:flex;gap:10px}
.tcol{flex:1;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:70px}
.tcol.red{background:var(--red-wash)} .tcol.blue{background:var(--blue-wash)}
.tcol h4{margin:0 0 2px;font-family:'Saira Condensed';font-weight:700;font-size:13px;letter-spacing:.08em;text-align:center}
.tcol.red h4{color:var(--red)} .tcol.blue h4{color:var(--blue)}
.ghostbtn{font-size:13.5px;color:var(--sage);border:1.5px dashed var(--sage);border-radius:9px;padding:7px 12px}
.warnchip{display:inline-block;font-size:12.5px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 9px;font-weight:700}
.fixbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bone);border:1px solid var(--warn);
  border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.fixbar button{color:var(--warn);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.selrow{display:flex;flex-wrap:wrap;gap:6px}
.selopt{border:1.5px solid var(--pencil);border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600;background:var(--bone)}
.selopt.on{border-color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.selopt .sub{display:block;font-size:11px;color:var(--sage);font-weight:400}
.timerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.timerow .gl{font-family:'Saira Condensed';font-weight:700;font-size:14px;letter-spacing:.06em;width:70px}
.timerow input[type=time]{font-family:'Saira Condensed';font-weight:700;font-size:20px;background:var(--bone);
  border:1px solid var(--pencil);border-radius:8px;padding:4px 8px;color:var(--ink)}
.cartgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cartcard{border:1px solid var(--pencil);border-radius:10px;background:var(--bone);padding:8px}
.cartcard h5{margin:0 0 6px;font-family:'Saira Condensed';font-weight:700;font-size:12px;letter-spacing:.08em;
  color:var(--sage);display:flex;justify-content:space-between;align-items:center}
.cartcard h5 .grp{border:1px solid var(--pencil);border-radius:5px;padding:0 5px;font-size:10.5px}
.seat{display:flex;align-items:center;gap:6px;min-height:42px;border:1.5px dashed var(--pencil);
  border-radius:8px;padding:2px 8px;margin-top:5px;font-weight:700;font-size:14px;width:100%;text-align:left}
.seat.filled{border-style:solid;background:var(--card)}
.seat.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.seat .em{font-size:18px}
.bench{margin-top:10px}
.helpers{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.mcard{border:1px solid var(--pencil);border-radius:10px;background:var(--bone);padding:8px 10px;margin-top:8px}
.mcard .row{display:flex;align-items:center;gap:6px}
.mcard .del{margin-left:auto;color:var(--ob);width:36px;height:36px;font-size:17px}
.mslot{border:1.5px solid transparent;border-radius:8px;padding:3px 8px;font-weight:700;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.mslot.r{color:var(--red);background:var(--red-wash)} .mslot.b{color:var(--blue);background:var(--blue-wash)}
.mslot.sel{border-color:var(--brass)}
.fmtcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fmtc{flex:0 0 150px;border:1.5px solid var(--pencil);border-radius:10px;background:var(--bone);padding:10px;text-align:left}
.fmtc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.fmtc .fn{font-family:'Saira Condensed';font-weight:700;font-size:14.5px;letter-spacing:.05em}
.fmtc .fd{font-size:11.5px;color:var(--sage);margin-top:3px;line-height:1.35}
.stepper{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--pencil);border-radius:9px;background:var(--bone)}
.stepper button{width:42px;height:42px;font-size:20px;color:var(--ink)}
.stepper .v{font-family:'Saira Condensed';font-weight:700;font-size:17px;min-width:44px;text-align:center}
.setupfoot{text-align:center;color:var(--sage);font-size:13px;padding:18px 0 4px}
.togg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--pencil);font-size:15px}
.togg:last-child{border-bottom:none}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--pencil);transition:background .15s;flex:0 0 48px}
.sw.on{background:var(--live)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.sw.on::after{left:23px}
.field{display:flex;align-items:center;gap:8px;padding:7px 0}
.field label{flex:1;font-size:14.5px}
.field input[type=text],.field input[type=number]{background:var(--bone);border:1px solid var(--pencil);
  border-radius:8px;padding:8px 10px;width:130px;font-size:15px}
.field input.wide{width:100%}
.hubrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--pencil);border-radius:12px;padding:12px;margin-bottom:8px}
.hubrow .hl{font-weight:700;font-size:15.5px}
.hubrow .hv{font-size:12.5px;color:var(--sage)}
.hubrow .chev{margin-left:auto;color:var(--sage);font-size:18px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--pencil)}
.prow:last-child{border-bottom:none}

  holder: { label:'Holder retains',      end:(s)=>`${s} — holders retain. That was the deal.` },

/* ===END DATA=== */

/* ===ENGINE=== */
const ENG = (() => {
  // ---- match play status ------------------------------------------------
  // holes: object {holeNo: {w: 'A'|'B'|'H'}} — only entered holes present.
  // order: array of hole numbers in play order (e.g. [1..18] or [10..18,1..9]).
  // concession: null | {by:'A'|'B', afterThru:int} — side that conceded the match.
  // Returns the full derived state; "for fun" holes after the match is decided
  // are ignored for the result but still counted in wonA/wonB display tallies.
  function matchState(holes, order, concession) {
    const n = order.length;
    let up = 0; // + means A leads
    let thru = 0; // holes with a result, counting in play order up to first gap
    let decidedAt = 0; // holes played when the match became decided (0 = live)
    let result = null; // {winner:'A'|'B'|null, text, margin, closed}
    let wonA = 0, wonB = 0, halved = 0;
    let i = 0;
    for (; i < n; i++) {
      const h = holes[order[i]];
      if (!h || !h.w) break;
      if (h.w === 'A') { wonA++; up++; } else if (h.w === 'B') { wonB++; up--; } else halved++;
      thru = i + 1;
      const remaining = n - thru;
      if (!result && Math.abs(up) > remaining) {
        decidedAt = thru;
        const margin = Math.abs(up);
        result = {
          winner: up > 0 ? 'A' : 'B',
          margin,
          closed: remaining > 0,
          text: remaining > 0 ? `${margin}&${remaining}` : (margin === 1 ? '1UP' : `${margin}UP`),
        };
      }
      if (!result && thru === n) {
        decidedAt = thru;
        result = up === 0
          ? { winner: null, margin: 0, closed: false, text: 'HALVED' }
          : { winner: up > 0 ? 'A' : 'B', margin: Math.abs(up), closed: false, text: `${Math.abs(up)}UP` };
      }
    }
    if (concession && !result) {
      result = {
        winner: concession.by === 'A' ? 'B' : 'A',
        margin: Math.abs(up),
        closed: true,
        conceded: true,
        text: 'CONC',
      };
      decidedAt = thru;
    }
    const remaining = n - thru;
    const dormie = !result && up !== 0 && Math.abs(up) === remaining && remaining > 0;
    return {
      up, thru, remaining, wonA, wonB, halved, dormie, decidedAt,
      done: !!result, result,
      statusText: result ? result.text
        : up === 0 ? 'A/S'
        : `${Math.abs(up)}UP`,
      leader: result ? result.winner : (up > 0 ? 'A' : up < 0 ? 'B' : null),
    };
  }

  // Points a finished match yields: [ptsA, ptsB] out of `worth`.
  function matchPoints(state, worth) {
    if (!state.done) return [0, 0];
    if (state.result.winner === 'A') return [worth, 0];
    if (state.result.winner === 'B') return [0, worth];
    return [worth / 2, worth / 2];
  }

  // Projected points while live: leader gets the full match, A/S splits.
  function projectedPoints(state, worth) {
    if (state.done) return matchPoints(state, worth);
    if (state.leader === 'A') return [worth, 0];
    if (state.leader === 'B') return [0, worth];
    return [worth / 2, worth / 2];
  }

  // ---- handicaps --------------------------------------------------------
  // WHS allowance presets by format (percent of course handicap).
  // side handicap construction differs by format:
  //   fourball: each player 90% individually, then all off the low PLAYER in match
  //   singles: 100% individually, off the low
  //   foursomes: side = 50% of (sum of both partners), diff to higher side
  //   greensomes/chapman: side = 60% low + 40% high
  //   scramble2: side = 35% low + 15% high
  //   shamble: commonly played like fourball (own ball from the drive): 90% off low
  const ALLOWANCES = {
    singles:   { kind: 'individual', pct: 100 },
    fourball:  { kind: 'individual', pct: 90 },
    shamble:   { kind: 'individual', pct: 85 },
    foursomes: { kind: 'side', calc: (lo, hi) => 0.5 * (lo + hi) },
    greensomes:{ kind: 'side', calc: (lo, hi) => 0.6 * lo + 0.4 * hi },
    chapman:   { kind: 'side', calc: (lo, hi) => 0.6 * lo + 0.4 * hi },
    scramble2: { kind: 'side', calc: (lo, hi) => 0.35 * lo + 0.15 * hi },
    scramble:  { kind: 'side', calc: (lo, hi) => 0.35 * lo + 0.15 * hi },
  };

  // players: [{id, ch, side}] ch = course handicap (int, may be negative).
  // format + options {net:bool, pctOverride?} →
  // map playerId (individual formats) or side (side formats) → strokes received (int >= 0).
  function playingStrokes(players, format, options) {
    const out = { players: {}, sides: {}, kind: 'individual' };
    if (!options || !options.net) {
      players.forEach((p) => { out.players[p.id] = 0; });
      out.sides = { A: 0, B: 0 };
      return out;
    }
    const spec = ALLOWANCES[format] || ALLOWANCES.singles;
    const pct = options.pctOverride != null ? options.pctOverride : (spec.kind === 'individual' ? spec.pct : null);
    if (spec.kind === 'individual') {
      const allowed = players.map((p) => ({ id: p.id, a: (p.ch || 0) * (pct / 100) }));
      const low = Math.min(...allowed.map((x) => x.a));
      allowed.forEach((x) => { out.players[x.id] = Math.max(0, Math.round(x.a - low)); });
      out.sides = { A: 0, B: 0 };
      return out;
    }
    out.kind = 'side';
    const bySide = { A: [], B: [] };
    players.forEach((p) => bySide[p.side].push(p.ch || 0));
    const sideH = {};
    for (const s of ['A', 'B']) {
      const chs = bySide[s];
      if (chs.length === 0) { sideH[s] = 0; continue; }
      const lo = Math.min(...chs), hi = Math.max(...chs);
      let h = chs.length === 1 ? lo : spec.calc(lo, hi);
      if (options.pctOverride != null) h = h * (options.pctOverride / 100) / 1; // override scales the side handicap
      sideH[s] = h;
    }
    const low = Math.min(sideH.A, sideH.B);
    out.sides = { A: Math.max(0, Math.round(sideH.A - low)), B: Math.max(0, Math.round(sideH.B - low)) };
    players.forEach((p) => { out.players[p.id] = 0; });
    return out;
  }

  // Strokes on a given hole for someone receiving `strokes` total, given the
  // hole's stroke index si (1..18) over `holesInRound` (18): 1 dot on the
  // hardest `strokes` holes, second dot where strokes > 18, etc.
  function dotsOnHole(strokes, si, holesInRound) {
    if (!strokes || !si) return 0;
    const H = holesInRound || 18;
    let dots = Math.floor(strokes / H);
    if (si <= (strokes % H)) dots++;
    return dots;
  }

  // ---- deriving a hole result from strokes ------------------------------
  // grossBySide for team-ball formats: {A: n|null, B: n|null}
  // grossByPlayer for own-ball formats: {playerId: n|null} (missing = picked up)
  // strokesInfo = output of playingStrokes; si = hole stroke index.
  // Returns 'A'|'B'|'H'|null (null = not derivable yet).
  function holeWinnerFromStrokes(fmt, entry, sidesPlayers, strokesInfo, si, holesInRound) {
    const sideNet = { A: null, B: null };
    if (strokesInfo.kind === 'side' || fmt === 'foursomes' || fmt === 'greensomes' || fmt === 'chapman' || fmt === 'scramble' || fmt === 'scramble2') {
      for (const s of ['A', 'B']) {
        const g = entry.sides && entry.sides[s];
        if (g == null) return null;
        sideNet[s] = g - dotsOnHole(strokesInfo.sides[s], si, holesInRound);
      }
    } else {
      // own-ball: best net among entered balls per side; a side with no ball
      // entered has picked up ONLY if the other side has at least one ball.
      for (const s of ['A', 'B']) {
        const ids = sidesPlayers[s];
        let best = null;
        for (const id of ids) {
          const g = entry.players && entry.players[id];
          if (g == null) continue;
          const net = g - dotsOnHole(strokesInfo.players[id], si, holesInRound);
          if (best === null || net < best) best = net;
        }
        sideNet[s] = best;
      }
      if (sideNet.A === null && sideNet.B === null) return null;
      if (sideNet.A === null) return 'B';
      if (sideNet.B === null) return 'A';
    }
    if (sideNet.A < sideNet.B) return 'A';
    if (sideNet.B < sideNet.A) return 'B';
    return 'H';
  }

  // ---- cup math ---------------------------------------------------------
  function cupTargets(totalPoints, holderTeam) {
    // smallest half-point step strictly above half the pool
    const win = Math.floor(totalPoints / 2 / 0.5) * 0.5 + 0.5;
    // a tie (and thus "holder retains") only exists when the pool splits evenly
    const tiePossible = (totalPoints * 2) % 2 === 0;
    return { win, retain: holderTeam && tiePossible ? totalPoints / 2 : null };
  }

  // course handicap from index (optional convenience): WHS full formula.
  function courseHandicap(index, slope, rating, par) {
    if (index == null || slope == null) return null;
    const cr = rating != null && par != null ? rating - par : 0;
    return Math.round(index * (slope / 113) + cr);
  }

  return { matchState, matchPoints, projectedPoints, playingStrokes, dotsOnHole,
           holeWinnerFromStrokes, cupTargets, courseHandicap, ALLOWANCES };
})();
/* ===END ENGINE=== */

function halfTxt(n){ const w=Math.floor(n); return (n-w>0.25) ? (w? w+'½':'½') : String(n); }

// ---- accessors (all defensive: remote data may be partial) -----------------
function cfg(){ return Object.assign(defConfig(), S.config || {}); }
function players(){ return Object.entries(S.players||{}).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>(a.ord||0)-(b.ord||0)); }
function namedPlayers(){ return players().filter(p => (p.name||'').trim()); }
function player(id){ const p=(S.players||{})[id]; return p ? Object.assign({id}, p) : {id, name:'??', emoji:'❔'}; }
function rosterReady(){ return namedPlayers().length > 0; }
function dayCfg(d){ const base = defDay(d); const s = (S.days||{})[d] || {}; const out = Object.assign({}, base, s);
  out.att = Object.assign({}, s.att||{}); out.teamOf = Object.assign({}, s.teamOf||{});
  out.times = Object.assign({}, base.times, s.times||{}); out.carts = Object.assign({}, s.carts||{}); return out; }
function isPresent(d, pid){ const a = dayCfg(d).att; return a[pid] !== false; }
function presentIds(d){ return namedPlayers().filter(p=>isPresent(d,p.id)).map(p=>p.id); }
function effTeam(d, pid){ const t = dayCfg(d).teamOf[pid]; if (t) return t; return (S.usualTeams||{})[pid] || null; }
function dayNet(d){ const dc = dayCfg(d); return dc.net == null ? cfg().net : dc.net; }
function dayAllowancePct(d){
  const dc = dayCfg(d), c = cfg();
  if (dc.allowancePct != null) return dc.allowancePct;
  if (c.flat100) return 100;
  const a = c.allowances || WHS_DEFAULTS;
  const spec = ENG.ALLOWANCES[dc.format] || ENG.ALLOWANCES.singles;
  if (spec.kind === 'individual') return a[dc.format] != null ? a[dc.format] : WHS_DEFAULTS[dc.format];
  return null; // side formats: engine's combination math; explicit override only via dc.allowancePct
}

// ---- course resolution -----------------------------------------------------
function holesFor(d){
  const dc = dayCfg(d);
  if (dc.course === 'custom' && dc.custom){
    const pars = dc.custom.pars || [], sis = dc.custom.sis || [];
    return Array.from({length:18},(_,i)=>({ no:i+1, par:pars[i]||4, si:sis[i]||i+1, yds:null, nine:null }));
  }
  if (dc.course === 'breck'){
    const rot = COURSES.breck.rotations[dc.rot] || COURSES.breck.rotations.bb;
    const out = []; let n = 1;
    rot.order.forEach((nk, half9) => {
      const nine = COURSES.breck.nines[nk];
      nine.forEach(h => {
        let si;
        if (dc.rot === 'bb') si = h.si;                       // printed Beaver/Bear card
        else if (dc.rot === 'eb') si = (nk==='elk') ? h.si : (h.siEB || h.si); // printed Elk/Beaver card
        else { // Bear→Elk: no printed card — ranks reallocated odd (first nine) / even (second)
          const rank = (nk==='bear') ? h.si/2 : (h.si+1)/2;
          si = half9 === 0 ? 2*rank-1 : 2*rank;
        }
        out.push({ no:n++, par:h.p, si:Math.round(si), yds:(h.y||{})[dayTee(d)]||null, nine:nk.toUpperCase() });
      });
    });
    return out;
  }
  const c = COURSES[dc.course];
  if (!c || !c.holes) return Array.from({length:18},(_,i)=>({ no:i+1, par:4, si:i+1, yds:null, nine:null }));
  return c.holes.map((h,i)=>({ no:i+1, par:h.p, si:h.si, yds:(h.y||{})[dayTee(d)]||null, nine:null }));
}
function dayCoursePar(d){ return holesFor(d).reduce((a,h)=>a+h.par,0); }
function dayTee(d){ const dc = dayCfg(d); if (dc.tee) return dc.tee;
  if (dc.course==='breck') return COURSES.breck.def; const c = COURSES[dc.course]; return c ? c.def : null; }
function dayTees(d){ const dc = dayCfg(d);
  if (dc.course==='breck') return (COURSES.breck.rotations[dc.rot]||COURSES.breck.rotations.bb).tees;
  const c = COURSES[dc.course]; return (c && c.tees) || []; }
function teeInfo(d){ const t = dayTee(d); return dayTees(d).find(x=>x.n===t) || null; }
function courseLabel(d){ const dc = dayCfg(d);
  if (dc.course==='tbd') return null;
  if (dc.course==='custom') return (dc.custom && dc.custom.name) || 'Custom course';
  if (dc.course==='breck') return COURSES.breck.short + ' · ' + (COURSES.breck.rotations[dc.rot]||{}).label;
  return (COURSES[dc.course]||{}).short || dc.course; }

// playing course handicap for a player on a day
function playingCH(d, p){
  if (p.hcp == null || p.hcp === '') return 0;
  const t = teeInfo(d);
  if (t && t.r && t.s) return ENG.courseHandicap(+p.hcp, t.s, t.r, dayCoursePar(d));
  return Math.round(+p.hcp);
}

// ---- matches ---------------------------------------------------------------
function matchesFor(d){
  return Object.entries(S.matches||{}).map(([id,m])=>Object.assign({id},m))
    .filter(m=>m.day===d)
    .sort((a,b)=> (a.group||'a').localeCompare(b.group||'a') || (a.ord||0)-(b.ord||0));
}
function allMatches(){ return DAYS.flatMap(matchesFor); }
function theMatch(id){ const m=(S.matches||{})[id]; return m ? Object.assign({id},m) : null; }
function sideIds(m, side){ const v = m[side==='A'?'red':'blue']; return Array.isArray(v) ? v.filter(Boolean) : Object.values(v||{}).filter(Boolean); }
function engineHoles(m){
  const out = {};
  for (const [n,h] of Object.entries(m.holes||{})){ if (h && h.winner && !h.exhibition) out[n] = { w:h.winner }; }
  return out;
}
const ORDER18 = Array.from({length:18},(_,i)=>i+1);
function mDer(m){
  const dc = dayCfg(m.day);
  const st = ENG.matchState(engineHoles(m), ORDER18, m.concededBy ? {by:m.concededBy, afterThru:m.concededAt||0} : null);
  const worth = (dc.points||1) * ((dc.x2 && dc.format==='singles') ? 2 : 1);
  return { st, worth, pts: ENG.matchPoints(st, worth), proj: ENG.projectedPoints(st, worth) };
}
function mStrokes(m){
  const d = m.day, dc = dayCfg(d);
  const ps = [...sideIds(m,'A').map(id=>({id, ch:playingCH(d, player(id)), side:'A'})),
              ...sideIds(m,'B').map(id=>({id, ch:playingCH(d, player(id)), side:'B'}))];
  const anyH = namedPlayers().some(p=>p.hcp!=null && p.hcp!=='');
  const net = dayNet(d) && anyH && dc.course !== 'tbd';
  let si = ENG.playingStrokes(ps, dc.format, { net, pctOverride: dayAllowancePct(d) == null ? null : dayAllowancePct(d) });
  const cap = cfg().strokeCap|0;
  if (cap > 0){ for (const k in si.players) si.players[k] = Math.min(si.players[k], cap);
                si.sides.A = Math.min(si.sides.A, cap); si.sides.B = Math.min(si.sides.B, cap); }
  si.net = net;
  return si;
}
function holeDots(m, si, holeNo, d){
  const hs = holesFor(d), h = hs[holeNo-1];
  const dots = { A:0, B:0, players:{} };
  if (!si.net) return dots;
  if (si.kind === 'side'){ dots.A = ENG.dotsOnHole(si.sides.A, h.si, 18); dots.B = ENG.dotsOnHole(si.sides.B, h.si, 18); }
  else for (const [pid, s] of Object.entries(si.players)){ const dd = ENG.dotsOnHole(s, h.si, 18); if (dd) dots.players[pid] = dd; }
  return dots;
}
function isOneBall(fmt){ return (FORMATS[fmt]||{}).oneBall; }
// derived winner from stored strokes on a hole (null if underivable)
function derivedWinner(m, holeNo){
  const h = (m.holes||{})[holeNo]; if (!h || !h.strokes) return null;
  const dc = dayCfg(m.day), si = mStrokes(m);
  const hs = holesFor(m.day)[holeNo-1];
  const sp = { A: sideIds(m,'A'), B: sideIds(m,'B') };
  let entry;
  if (isOneBall(dc.format)){
    if (h.strokes.A == null || h.strokes.B == null) return null;
    entry = { sides: h.strokes };
  } else {
    // completeness gate: a side counts as "in" once it has a numeric score,
    // or as picked up once EVERY entered ball on it is a pickup — a side
    // nobody has entered anything for is not yet derivable, never a loss.
    for (const side of ['A','B']){
      const ids = sp[side];
      const numeric = ids.some(pid => typeof h.strokes[pid] === 'number');
      const allPick = ids.length > 0 && ids.every(pid => h.strokes[pid] === 'pickup');
      if (!numeric && !allPick) return null;
    }
    entry = { players:{} };
    for (const [pid,v] of Object.entries(h.strokes)) if (v !== 'pickup' && v != null) entry.players[pid] = v;
  }
  return ENG.holeWinnerFromStrokes(dc.format, entry, sp, si, hs.si, 18);
}
function overridden(m, holeNo){
  const h = (m.holes||{})[holeNo];
  if (!h || !h.winner || h.via !== 'tap' || !h.strokes) return false;
  const dw = derivedWinner(m, holeNo);
  return dw != null && dw !== h.winner;
}

// ---- cup math --------------------------------------------------------------
function cup(){
  let red=0, blue=0, pRed=0, pBlue=0, scheduled=0, liveLed = {red:0, blue:0};
  for (const m of allMatches()){
    const dr = mDer(m); scheduled += dr.worth;
    red += dr.pts[0]; blue += dr.pts[1];
    pRed += dr.proj[0]; pBlue += dr.proj[1];
    if (!dr.st.done && dr.st.leader==='A') liveLed.red++;
    if (!dr.st.done && dr.st.leader==='B') liveLed.blue++;
  }
  const c = cfg();
  const t = ENG.cupTargets(scheduled || 1, c.holder || null);
  return { red, blue, pRed, pBlue, scheduled, win: t.win, retain: t.retain, holder: c.holder, liveLed };
}
function dayPts(d){
  let red=0, blue=0, done=true, any=false;
  for (const m of matchesFor(d)){ any=true; const dr=mDer(m); red+=dr.pts[0]; blue+=dr.pts[1]; if (!dr.st.done) done=false; }
  return { red, blue, done: done&&any, any };
}
function mvpRows(){
  const rows = {};
  for (const p of namedPlayers()) rows[p.id] = { p, w:0, l:0, h:0, pts:0, played:0 };
  for (const m of allMatches()){
    const dr = mDer(m); if (!dr.st.done) continue;
    const winSide = dr.st.result.winner;
    ['A','B'].forEach(side => {
      for (const pid of sideIds(m, side)){
        const r = rows[pid]; if (!r) continue;
        r.played++;
        if (winSide === null){ r.h++; r.pts += dr.worth/2; }
        else if (winSide === side){ r.w++; r.pts += dr.worth; }
        else r.l++;
      }
    });
  }
  return Object.values(rows).sort((a,b)=> b.pts-a.pts || b.w-a.w || a.p.ord-b.p.ord);
}

// ---- date/day resolution ---------------------------------------------------
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function resolveDay(){
  const t = todayISO();
  for (const d of DAYS) if (DAYMETA[d].date === t) return d;
  if (t < DAYMETA.fri.date) return 'fri';
  return 'mon';
}
function tripOver(){ return todayISO() > DAYMETA.mon.date; }
function isFutureDay(d){ return DAYMETA[d].date > todayISO(); }
function isToday(d){ return DAYMETA[d].date === todayISO(); }

/* ===SYNC=== */
function dbUrl(){
  const o = LS.get('db', null);
  return (o != null ? o : CONFIG.dbUrl).replace(/\/+$/,'');
}
function dbConfigured(){ return !!dbUrl(); }
function pathUrl(p){ return dbUrl() + '/' + CONFIG.dbPath + (p ? '/'+p : '') + '.json'; }

function applyPath(path, value){
  if (!path){ S = (value && typeof value==='object') ? value : {}; return; }
  const segs = path.split('/');
  let node = S;
  for (let i=0;i<segs.length-1;i++){
    const k = segs[i];
    if (typeof node[k] !== 'object' || node[k] === null) node[k] = {};
    node = node[k];
  }
  const leaf = segs[segs.length-1];
  if (value === null || value === undefined) delete node[leaf];
  else node[leaf] = value;
}

function op(path, value){
  applyPath(path, value);
  // coalesce: this op supersedes pending ops at the same path or beneath it
  pend = pend.filter(o => o.path !== path && !o.path.startsWith(path ? path+'/' : ''));
  pend.push({ id: uid(), path, value: value === undefined ? null : value });
  LS.set('pend', pend); LS.set('cache', S);
  scheduleFlush();
  requestRender();
}

let flushing = false, flushBackoff = 2000, flushTimer = null;
function scheduleFlush(delay){
  if (!dbConfigured()){ ui.sync = 'rm'; return; }
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flushLoop, delay || 30);
}
async function flushLoop(){
  if (flushing || !dbConfigured()) return;
  flushing = true;
  while (pend.length){
    updatePill(pend.length ? 'sy' : 'live');
    const o = pend[0];
    try {
      const res = await fetch(pathUrl(o.path), { method:'PUT', body: JSON.stringify(o.value), headers:{'Content-Type':'application/json'} });
      if (!res.ok) throw new Error('HTTP '+res.status);
      pend.shift(); LS.set('pend', pend);
      flushBackoff = 2000;
    } catch(e) {
      flushing = false;
      updatePill('q');
      scheduleFlush(flushBackoff);
      flushBackoff = Math.min(flushBackoff*2, 30000);
      return;
    }
  }
  flushing = false;
  updatePill(sse.ok ? 'live' : (dbConfigured() ? 'rc' : 'rm'));
}
function updatePill(state){
  if (!dbConfigured()) state = 'rm';
  else if (pend.length) state = 'q';
  ui.sync = state;
  document.querySelectorAll('[data-pill]').forEach(el => { el.outerHTML = pillHtml(); });
}

const sse = { es:null, ok:false, errs:0, poll:null };
function sseConnect(){
  if (!dbConfigured() || sse.es) return;
  try {
    const es = new EventSource(pathUrl(''));
    sse.es = es;
    es.addEventListener('put', ev => { sse.ok = true; sse.errs = 0; remoteEvent('put', JSON.parse(ev.data)); });
    es.addEventListener('patch', ev => { remoteEvent('patch', JSON.parse(ev.data)); });
    es.addEventListener('keep-alive', ()=>{ sse.ok = true; });
    es.onerror = () => {
      sse.ok = false; sse.errs++;
      updatePill('rc');
      if (sse.errs >= 3){ try{ es.close(); }catch(e){} sse.es = null; startPoll(); }
    };
    es.onopen = () => { sse.ok = true; sse.errs = 0; stopPoll(); updatePill(pend.length?'q':'live'); };
  } catch(e){ startPoll(); }
}
function startPoll(){
  if (sse.poll) return;
  sse.poll = setInterval(async () => {
    if (document.hidden || !dbConfigured()) return;
    try {
      const res = await fetch(pathUrl(''));
      if (res.ok) remoteEvent('put', { path:'/', data: await res.json() });
    } catch(e){}
  }, 15000);
}
function stopPoll(){ clearInterval(sse.poll); sse.poll = null; }

function remoteEvent(kind, ev){
  const before = snapshotForDiff();
  const p = (ev.path||'/').replace(/^\//,'');
  if (kind === 'put') applyPath(p, ev.data);
  else if (ev.data && typeof ev.data === 'object') for (const [k,v] of Object.entries(ev.data)) applyPath(p ? p+'/'+k : k, v);
  // local pending edits win until flushed
  for (const o of pend) applyPath(o.path, o.value);
  LS.set('cache', S);
  afterRemote(before, p);
  requestRender();
}
function snapshotForDiff(){
  const finals = {};
  for (const m of allMatches()){ const dr = mDer(m); if (dr.st.done) finals[m.id] = dr.st.result.text; }
  const c = cup();
  return { finals, red: c.red, blue: c.blue };
}
function afterRemote(before, evPath){
  const after = snapshotForDiff();
  for (const [id, txt] of Object.entries(after.finals)){
    if (before.finals[id] !== txt && ui.seenFinals[id] !== txt){
      ui.seenFinals[id] = txt;
      pointPost();
      maybeClinch();
    }
  }
  // conflict toast: a remote write landed on the hole being actively viewed/edited
  const mId = ui.matchId;
  if (ui.screen === 'match' && mId && evPath.startsWith('matches/'+mId+'/holes/')){
    const hn = evPath.split('/')[3];
    if (String(ui.hole[mId]) === String(hn)) toastSnack(`Another phone also scored ${hn} — showing latest`);
  }
}
function pointPost(){
  try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
  document.querySelectorAll('.tug .aR,.tug .aB').forEach(el=>{ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); });
  document.querySelectorAll('.cupline .pts').forEach(el=>{ el.classList.remove('ticked'); void el.offsetWidth; el.classList.add('ticked'); });
}

    const r = st.result;
    if (r.winner === null) return `<span class="chip halv fin">HALVED</span>`;
    const cls = r.winner==='A'?'R':'B';
    const pre = r.conceded ? `<span class="pre">CONC</span>` : '';
    const txt = r.conceded ? `${st.up===0?'1UP':Math.abs(st.up)+'UP'}` : r.text;
    return `<span class="chip ${cls} fin">${pre}${txt} ✓</span>`;
  }
  if (st.thru === 0){
    const dc = dayCfg(m.day);
    const t = (dc.times||{})[m.group||'a'] || '';
    return `<span class="chip tee">${fmtTime(t)}</span>`;
  }
  if (st.leader === null) return `<span class="chip as">A/S</span>`;
  const cls = st.leader==='A'?'R':'B';
  if (st.dormie) return `<span class="chip ${cls} dormie">DORMIE</span>`;
  return `<span class="chip ${cls}">${Math.abs(st.up)}UP</span>`;
}
function fmtTime(t){
  if (!t) return '—';
  const [h,mn] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; const hh = ((h+11)%12)+1;
  return `${hh}:${String(mn).padStart(2,'0')} ${ap}`;
}

function strokesDrawerHtml(m, d, n){

    const par = h.par;
    const nums = [];
    const curNum = typeof cur === 'number' ? cur : null;
    for (let v = Math.max(1,par-2); v <= par+2; v++){
      const set = curNum === v;
      nums.push(`<button class="qn ${set?('set '+cls):(v===par&&curNum==null?'ghost':'')}" data-act="gross" data-id="${m.id}" data-n="${n}" data-k="${esc(key)}" data-v="${v}">${v}</button>`);
    }
    const minus = `<button class="qn step" data-act="gross" data-id="${m.id}" data-n="${n}" data-k="${esc(key)}" data-v="${(curNum!=null?curNum:par)-1}">−</button>`;
    const plus  = `<button class="qn step" data-act="gross" data-id="${m.id}" data-n="${n}" data-k="${esc(key)}" data-v="${(curNum!=null?curNum:par)+1}">+</button>`;
    const dot = dotN ? ` <span class="brass">${'●'.repeat(Math.min(dotN,2))}</span>` : '';
    // outlier values (outside the quick row) still render as a set stepper state
    const outlier = (curNum!=null && (curNum < Math.max(1,par-2) || curNum > par+2)) ? `<span class="netlab">${curNum}</span>` : '';
    let sub = '';
    const bits = [];
    if (dotN && curNum!=null) bits.push(`<span class="netlab">${curNum} → net ${curNum-dotN}</span>`);
    if (cur==='pickup') bits.push(`<span class="mut" style="font-size:12px">picked up</span>`);
    if (!oneBall && dc.format!=='singles')
      bits.push(`<button class="pickup" data-act="pickup" data-id="${m.id}" data-n="${n}" data-k="${esc(key)}">${cur==='pickup'?'back in':'pickup'}</button>`);
    if (bits.length) sub = `<div class="srowsub">${bits.join(' · ')}</div>`;
    return `<div class="srow ${cur==='pickup'?'picked':''}"><span class="who ${cls}">${label}${dot}</span><div class="qnums">${minus}${nums.join('')}${plus}</div>${outlier}</div>${sub}`;
  };
  const dots = holeDots(m, si, n, d);
  if (oneBall){
    const emA = sideIds(m,'A').map(pid=>player(pid).emoji).join('');
    const emB = sideIds(m,'B').map(pid=>player(pid).emoji).join('');
    rows += qrow('A', emA+' '+esc(teamName('A')), 'r', stored.A, dots.A);
    rows += qrow('B', emB+' '+esc(teamName('B')), 'b', stored.B, dots.B);
  } else {
    for (const side of ['A','B'])
      for (const pid of sideIds(m, side))
        rows += qrow(pid, pName(pid), side==='A'?'r':'b', stored[pid], (dots.players||{})[pid]||0);
  }
  // derivation banner
  const dw = derivedWinner(m, n);
  let ban;
  const hasAny = Object.keys(stored).length > 0;
  if (dw === 'A' || dw === 'B'){
    const nets = ''; // detail omitted; margin below
    ban = `<div class="dbanner ${dw==='A'?'r':'b'}">Derived: ${teamName(dw)} win${si.net?' (net)':''} — tap the lit button to post it</div>`;
  }
  else if (dw === 'H') ban = `<div class="dbanner h">HOLE HALVED${si.net?' — net tie':''} — tap HALVE to post it</div>`;
  else if (hasAny){
    const missing = [];
    if (oneBall){ if (stored.A==null) missing.push(teamName('A')); if (stored.B==null) missing.push(teamName('B')); }
    else for (const side of ['A','B']){
      const ids = sideIds(m, side);
      if (!ids.some(pid=>stored[pid]!=null && stored[pid]!=='pickup') && !ids.every(pid=>stored[pid]==='pickup')) missing.push(teamName(side));
    }
    ban = `<div class="dbanner w">Waiting on ${missing.map(esc).join(' and ')||'more scores'}…</div>`;
  }
  else ban = `<div class="dbanner w">Enter gross scores — the app does the net math</div>`;
  return `<div class="drawer">${ban}${rows}</div>`;
}

      <td class="n">${[notes.join(' · '), jd].filter(Boolean).join(' · ')}</td></tr>`;
  }
  if (!rows) return '';
  return `<div class="ledger"><table><tr><th>Hole</th><th>Par</th><th>SI</th><th>Result</th><th>Strokes</th><th>Notes</th></tr>${rows}</table></div>`;
}
function renderMatch(id){

  const dc = dayCfg(d);

  const idx = ms.findIndex(x=>x.id===id);

  return `

  <div data-swipe="1">

    <div class="pair">

      <span class="vs">vs</span>
      <div class="pn B">${sideIds(m,'B').map(pName).join(' + ')||'—'}</div>
    </div>
    <div class="mmeta"><span>MATCH ${idx+1} · ${FORMATS[dc.format].name} · ${net?'NET':'GROSS'} · ${halfTxt(dr.worth)} PT · ${DAYMETA[d].label}${courseLabel(d)?' · '+esc(courseLabel(d).split('·')[0]):''}</span>

  </div>
  ${bigStatusHtml(m, dr)}

}

/* ===VIEWS 2: setup, settings, sheets, overlays=== */
function renderSetupDay(d){
  const dc = dayCfg(d);
  const named = namedPlayers();
  const present = presentIds(d);
  const nPresent = present.length;

  // Block 1: attendance
  const att = named.map(p=>{
    const inD = isPresent(d, p.id);
    return `<button class="pchip ${inD?'':'out'}" data-act="att" data-d="${d}" data-p="${p.id}">
      <span class="em">${p.emoji}</span><span class="nm">${esc(p.name)}</span></button>`;
  }).join('');
  // fix bar: players out but still seated/matched
  const outs = named.filter(p=>!isPresent(d,p.id));
  let fixbar = '';
  for (const p of outs){
    const seated = Object.values(dc.carts).some(c=>c && arr(c.seats).includes(p.id));
    const matched = matchesFor(d).some(m=>sideIds(m,'A').includes(p.id)||sideIds(m,'B').includes(p.id));
    if (seated || matched){
      fixbar = `<div class="fixbar">${p.emoji} ${esc(p.name)} is out. ${seated?'His cart seat':''}${seated&&matched?' and ':''}${matched?'his match spot':''} ${seated||matched?'are open.':''}
        ${seated?`<button data-act="scroll" data-t="carts">Fix carts</button>`:''}
        ${matched?`<button data-act="scroll" data-t="matches">Fix matches</button>`:''}</div>`;
      break;
    }
  }

  // Block 2: teams today
  const col = (team) => present.filter(pid=>effTeam(d,pid)===team).map(pid=>{
    return `<button class="pchip ${team==='red'?'redx':'bluex'}" data-act="flipteam" data-d="${d}" data-p="${pid}">
      <span class="em">${player(pid).emoji}</span><span class="nm">${esc(player(pid).name)}</span></button>`;
  }).join('');
  const unassigned = present.filter(pid=>!effTeam(d,pid));
  const unHtml = unassigned.length ? `<div style="margin-top:8px"><div class="mut" style="font-size:13px">No side yet — tap to assign:</div>
    <div class="selrow" style="margin-top:5px">${unassigned.map(pid=>`<button class="pchip" style="width:auto" data-act="flipteam" data-d="${d}" data-p="${pid}"><span class="em">${player(pid).emoji}</span><span class="nm">${esc(player(pid).name)}</span></button>`).join('')}</div></div>` : '';
  const rc = present.filter(pid=>effTeam(d,pid)==='red').length;
  const bc = present.filter(pid=>effTeam(d,pid)==='blue').length;
  const uneven = rc && bc && rc!==bc ? `<span class="warnchip">${rc}v${bc} — sure?</span>` : '';
  const anyHcp = named.some(p=>p.hcp!=null && p.hcp!=='');
  let balance = '';
  if (anyHcp){
    const sum = t => present.filter(pid=>effTeam(d,pid)===t).reduce((a,pid)=>a+(+player(pid).hcp||0),0).toFixed(1);
    balance = `<div class="mut" style="font-size:12.5px;margin-top:6px">Σ index: ${teamName('A')} ${sum('red')} · ${teamName('B')} ${sum('blue')}</div>`;
  }
  const prevD = DAYS[DAYS.indexOf(d)-1];

  // Block 3: course & tees
  const courseOpts = [['tbd','TBD'],['vail','Vail GC'],['breck','Breckenridge'],['river','Keystone — River'],['ranch','Keystone — Ranch'],['custom','Other course…']];
  const courseSel = `<div class="selrow">` + courseOpts.map(([k,l]) =>
    `<button class="selopt ${dc.course===k?'on':''}" data-act="course" data-d="${d}" data-v="${k}">${l}</button>`).join('') + `</div>`;
  let rotSel = '';
  if (dc.course === 'breck'){
    rotSel = `<div class="selrow" style="margin-top:8px">` + Object.entries(COURSES.breck.rotations).map(([k,r]) =>
      `<button class="selopt ${dc.rot===k?'on':''}" data-act="rot" data-d="${d}" data-v="${k}">${r.label}${r.est?' ⚠':''}</button>`).join('') + `</div>` +
      (dc.rot==='be' ? `<div class="mut" style="font-size:12.5px;margin-top:5px">No printed card for Bear→Elk — stroke allocation is derived from the other two cards.</div>`:'');
  }
  let teeSel = '';
  const tees = dayTees(d);
  if (tees.length){
    teeSel = `<div class="selrow" style="margin-top:8px">` + tees.map(t =>
      `<button class="selopt ${dayTee(d)===t.n?'on':''}" data-act="tee" data-d="${d}" data-v="${esc(t.n)}">${esc(t.n)}
        <span class="sub">${t.y?t.y+'y':''}${t.r?` · ${t.r}/${t.s}`:''}</span></button>`).join('') + `</div>`;
  }
  let customCard = '';
  if (dc.course === 'custom'){
    const cst = dc.custom || {name:'', pars:Array(18).fill(4), sis:[]};
    const parsArr = arr(cst.pars); const parGrid = Array.from({length:18},(_,i)=>
      `<button class="qn" style="width:40px;height:40px" data-act="cyclepar" data-d="${d}" data-i="${i}">${parsArr[i]||4}</button>`).join('');
    customCard = `<div style="margin-top:8px">
      <div class="field"><label>Course name</label><input type="text" class="wide" value="${esc(cst.name||'')}" data-input="customname" data-d="${d}"></div>
      <div class="mut" style="font-size:12.5px;margin:4px 0">Pars — tap to cycle 3→4→5:</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${parGrid}</div>
      ${dayNet(d) && !arr(cst.sis).length ? `<div class="mut" style="font-size:12.5px;margin-top:6px">No stroke index — net strokes will fall 1–18 by hole number unless you enter one.</div>`:''}
    </div>`;
  }
  const netTbd = (dayNet(d) && dc.course==='tbd') ? `<div class="mut" style="font-size:13px;margin-top:6px">Net needs a course card. Pick the course or play it gross.</div>` : '';

  // Block 4: carts & times
  const seated = new Set(Object.values(dc.carts).flatMap(c=>arr(c&&c.seats)).filter(Boolean));
  const bench = present.filter(pid=>!seated.has(pid));
  const cartN = nPresent<=4 ? 2 : 4;
  let cartCards = '';
  for (let i=1;i<=cartN;i++){
    const ck = 'c'+i;
    const cart = dc.carts[ck] || { seats:[], group: i<=2?'a':'b' };
    const seats = arr(cart.seats).filter(Boolean);
    const seatBtns = [];
    const seatCount = Math.max(2, seats.length + (seats.length>=2 && seats.length<3 && nPresent>cartN*2 ? 1 : 0));
    for (let s=0;s<Math.max(2, seats.length+ (seats.length>=2?1:0) ); s++){
      if (s>=3) break;
      const pid = seats[s];
      const selCls = ui.pick && ui.pick.kind==='seat' && ui.pick.ck===ck && ui.pick.s===s ? 'sel' : '';
      if (pid) seatBtns.push(`<button class="seat filled ${selCls}" data-act="seat" data-d="${d}" data-ck="${ck}" data-s="${s}"><span class="em">${player(pid).emoji}</span> ${esc(player(pid).name)}</button>`);
      else if (s<2 || nPresent>cartN*2) seatBtns.push(`<button class="seat ${selCls}" data-act="seat" data-d="${d}" data-ck="${ck}" data-s="${s}"><span class="mut">${s===2?'+1 on the back':'empty seat'}</span></button>`);
    }
    const tag = seats.length===1?' · SOLO':'';
    cartCards += `<div class="cartcard"><h5>CART ${i}${tag}<button class="grp" data-act="cartgroup" data-d="${d}" data-ck="${ck}">${(cart.group||'a').toUpperCase()} ⇄</button></h5>${seatBtns.join('')}</div>`;
  }
  const benchHtml = bench.length ? `<div class="bench"><div class="mut" style="font-size:12.5px;margin-bottom:4px">BENCH — tap a player, then a seat:</div>
    <div class="selrow">${bench.map(pid=>`<button class="pchip ${ui.pick&&ui.pick.kind==='bench'&&ui.pick.pid===pid?'sel':''}" style="width:auto" data-act="bench" data-d="${d}" data-p="${pid}"><span class="em">${player(pid).emoji}</span><span class="nm">${esc(player(pid).name)}</span></button>`).join('')}</div></div>` : '';
  const thirdCart = ['a','b'].map(g=>Object.entries(dc.carts).filter(([,c])=>c&&(c.group||'a')===g).length).some(n=>n>2)
    ? `<div class="warnchip" style="margin-top:6px">3 carts in one wave — fine if the course allows it</div>` : '';

  // Block 5: matches
  const ms = matchesFor(d);
  const mCards = ms.map(m=>{
    const scored = Object.values(m.holes||{}).some(h=>h&&h.winner);
    const slot = (side) => sideIds(m,side).map(pid=>{
      const selCls = ui.pick && ui.pick.kind==='slot' && ui.pick.mid===m.id && ui.pick.pid===pid ? 'sel':'';
      return `<button class="mslot ${side==='A'?'r':'b'} ${selCls}" data-act="slot" data-mid="${m.id}" data-side="${side}" data-p="${pid}">${pName(pid)}</button>`;
    }).join('') || `<button class="mslot ${side==='A'?'r':'b'}" data-act="slot" data-mid="${m.id}" data-side="${side}" data-p="">+</button>`;
    return `<div class="mcard"><div class="row">
      ${slot('A')}<span class="mut" style="font-size:12px">vs</span>${slot('B')}
      <span class="mut" style="font-size:11px;margin-left:auto">${fmtTime((dc.times||{})[m.group||'a'])}${scored?' · scored':''}</span>
      <button class="del" data-act="delmatch" data-mid="${m.id}">✕</button>
    </div></div>`;
  }).join('');
  const makeLabel = dc.format==='singles' ? 'Make singles' : 'Make matches: cart vs cart';

  // Block 6: format & points
  const fmtCards = Object.entries(FORMATS).map(([k,f])=>
    `<button class="fmtc ${dc.format===k?'on':''}" data-act="fmt" data-d="${d}" data-v="${k}">
      <div class="fn sc">${f.name}</div><div class="fd">${f.desc}</div></button>`).join('');
  const net = dayNet(d);
  const pct = dayAllowancePct(d);
  const allowChip = net ? `<button class="selopt" data-act="allowsheet" data-d="${d}">NET · ${pct!=null?pct+'%':'WHS combo'}${cfg().allowances && dc.format==='fourball' && pct===90?' OFF LOW':''} ✎</button>` : '';
  const x2html = dc.format==='singles' ? `<div class="togg"><span>Double singles <span class="mut" style="font-size:12.5px">— Singles ×2 → trip total ${halfTxt(cup().scheduled + (dc.x2?0:matchesFor(d).reduce((a,m)=>a+(dc.points||1),0)) - (dc.x2?matchesFor(d).reduce((a,m)=>a+(dc.points||1),0):0))} → recomputes live</span></span>
      <button class="sw ${dc.x2?'on':''}" data-act="x2" data-d="${d}" role="switch" aria-checked="${!!dc.x2}"></button></div>` : '';

  return `
  <div class="appbar"><button class="backbtn" data-act="board">‹</button>
    <span class="wordmark sc">${DAYMETA[d].label} · ${DAYMETA[d].dshort}</span><span class="sp"></span>${pillHtml()}
    <button class="pill" data-act="board" style="color:var(--brass);border-color:var(--brass)">DONE</button></div>
  <div class="spage">
    <h2>1 · Who’s playing <span class="ct">${nPresent} PLAYING</span></h2>
    <div class="block"><div class="pchips">${att}</div>${fixbar}</div>

    <h2>2 · Teams today ${uneven}</h2>
    <div class="block">
      <div class="teamcols">
        <div class="tcol red"><h4 class="sc">${esc(teamName('A'))}</h4>${col('red')}</div>
        <div class="tcol blue"><h4 class="sc">${esc(teamName('B'))}</h4>${col('blue')}</div>
      </div>${unHtml}${balance}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        ${prevD?`<button class="ghostbtn" data-act="copyteams" data-d="${d}">Copy ${DAYMETA[prevD].name}’s teams</button>`:''}
        <span class="mut" style="font-size:12px;align-self:center">Tap a player to flip his side. Sides are just for today.</span>
      </div>
    </div>

    <h2 id="course">3 · Course &amp; tees</h2>
    <div class="block">${courseSel}${rotSel}${teeSel}${customCard}${netTbd}</div>

    <h2 id="carts">4 · Tee times &amp; carts</h2>
    <div class="block">
      <div class="timerow"><span class="gl sc">GROUP A</span><input type="time" value="${esc((dc.times||{}).a||'08:00')}" data-input="time" data-d="${d}" data-g="a"></div>
      ${nPresent>4?`<div class="timerow"><span class="gl sc">GROUP B</span><input type="time" value="${esc((dc.times||{}).b||'08:10')}" data-input="time" data-d="${d}" data-g="b"></div>`:''}
      <div class="helpers">
        <button class="ghostbtn" data-act="ridepartner" data-d="${d}">Ride with your partner</button>
        <button class="ghostbtn" data-act="mixitup" data-d="${d}">Mix it up</button>
      </div>
      <div class="cartgrid">${cartCards}</div>${thirdCart}${benchHtml}
    </div>

    <h2 id="matches">5 · Matches</h2>
    <div class="block">
      <button class="cta" style="margin:0 0 4px" data-act="makematches" data-d="${d}">${makeLabel}</button>
      ${mCards}
      <div style="margin-top:8px"><button class="ghostbtn" data-act="addmatch" data-d="${d}">+ Add match</button>
      <span class="mut" style="font-size:12px">Tap a name in a match, then a bench/other name to swap.</span></div>
    </div>

    <h2>6 · Format &amp; points today</h2>
    <div class="block">
      <div class="fmtcards">${fmtCards}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="selopt ${!net?'on':''}" data-act="daynet" data-d="${d}" data-v="0">GROSS</button>
        <button class="selopt ${net?'on':''}" data-act="daynet" data-d="${d}" data-v="1">NET</button>
        ${allowChip}
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
        <span>Points per match today</span><span class="sp" style="flex:1"></span>
        <div class="stepper"><button data-act="pts" data-d="${d}" data-v="-0.5">−</button><span class="v sc">${halfTxt(dc.points||1)}</span><button data-act="pts" data-d="${d}" data-v="0.5">+</button></div>
      </div>
      ${x2html}
    </div>
    <div class="setupfoot">Everything here can be changed later — even mid-round.</div>
  </div>`;
}

      <div>${conf.net?'Net':'Gross'} play${conf.net?` · ${conf.flat100?'flat 100%':'WHS allowances'}${conf.strokeCap?` · cap ${conf.strokeCap}`:''}`:''}</div>

function skinsSummary(){
  const conf = cfg();
  const won = {}; let carried = 0;
  for (const d of DAYS){
    const ms = matchesFor(d);
    if (!ms.length) continue;
    let carry = 0;
    for (let n=1;n<=18;n++){
      const entries = [];
      for (const m of ms){
        const hd = (m.holes||{})[n];
        if (!hd || !hd.strokes) continue;
        const si = mStrokes(m);
        const hcell = holesFor(d)[n-1];
        for (const [k,v] of Object.entries(hd.strokes)){
          if (v==='pickup'||v==null||k==='A'||k==='B') continue;
          const dots = conf.skinsNet ? ENG.dotsOnHole(si.players[k]||0, hcell.si, 18) : 0;
          entries.push({ pid:k, net:v-dots });
        }
      }
      if (!entries.length) continue;
      entries.sort((a,b)=>a.net-b.net);
      if (entries.length===1 || entries[0].net < entries[1].net){
        won[entries[0].pid] = (won[entries[0].pid]||0) + 1 + (conf.skinsCarry?carry:0); carry = 0;
      } else if (conf.skinsCarry) carry++;
    }
    carried += carry;
  }
  const l = Object.entries(won).sort((a,b)=>b[1]-a[1]).map(([pid,n])=>`${player(pid).emoji} ${n}`).join(' · ');
  return l ? l + (carried?` · ${carried} carried`:'') : '<span class="mut">Needs stroke entry — nothing derivable yet.</span>';
}

const $app = document.getElementById('app');
const $sheetlayer = document.getElementById('sheetlayer');
const $sheetbox = document.getElementById('sheetbox');
const $snack = document.getElementById('snack');
const $takeover = document.getElementById('takeover');

let raf = 0, renderDeferred = false;
function inputFocused(){
  const a = document.activeElement;
  return a && (a.tagName==='INPUT' || a.tagName==='SELECT' || a.tagName==='TEXTAREA');
}
function requestRender(){
  if (raf) return;
  raf = requestAnimationFrame(()=>{ raf = 0;
    if (inputFocused()){ renderDeferred = true; return; }
    render();
  });
}
document.addEventListener('focusout', ()=>{ if (renderDeferred){ renderDeferred=false; setTimeout(requestRender, 60); } });

function render(){
  const me = LS.get('id', null);
  if (!rosterReady()){
    $app.innerHTML = renderKickoff();
    return;
  }
  if (!me || ui.screen==='who'){ $app.innerHTML = renderWho(); return; }
  let html = '';
  if (ui.screen === 'match' && ui.matchId) html = renderMatch(ui.matchId);
  else if (ui.screen === 'setup' && ui.day) html = renderSetupDay(ui.day);
  else if (ui.screen === 'settings') html = renderSettings();
  else html = renderBoard(ui.day || resolveDay());
  $app.innerHTML = html;
  postRender();
}
function postRender(){
  if (ui.screen === 'match' && ui.matchId){
    const m = theMatch(ui.matchId);
    if (m){
      const cell = document.getElementById('cell'+curHole(m));
      if (cell) cell.scrollIntoView({ block:'nearest', inline:'center', behavior:'auto' });
    }
  }
}

// ---- navigation ------------------------------------------------------------
function navigate(hash){ if (location.hash === hash) { parseRoute(); requestRender(); } else location.hash = hash; }
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  closeSheet(true);
  if (parts[0]==='who'){ ui.screen='who'; return; }
  if (parts[0]==='match' && parts[1] && theMatch(parts[1])){
    ui.screen='match'; ui.matchId = parts[1]; ui.day = theMatch(parts[1]).day; LS.set('day', ui.day); return;
  }
  if (parts[0]==='day' && DAYS.includes(parts[1])){
    ui.day = parts[1]; LS.set('day', ui.day);
    ui.screen = parts[2]==='setup' ? 'setup' : 'board'; return;
  }
  if (parts[0]==='settings'){ ui.screen='settings'; return; }
  ui.screen='board'; ui.day = ui.day || resolveDay();
}
window.addEventListener('hashchange', ()=>{ parseRoute(); requestRender(); });

// ---- sheets ---------------------------------------------------------------
function openSheet(type, data){
  ui.sheet = Object.assign({ type }, data||{});
  $sheetbox.innerHTML = sheetHtml(ui.sheet);
  $sheetlayer.classList.add('open');
  try{ history.pushState({ngSheet:true}, ''); }catch(e){}
}
function closeSheet(silent){
  if (!ui.sheet) return;
  ui.sheet = null;
  $sheetlayer.classList.remove('open');
  if (!silent && history.state && history.state.ngSheet) history.back();
}
window.addEventListener('popstate', ()=>{
  if (ui.sheet){ ui.sheet=null; $sheetlayer.classList.remove('open'); return; }
  parseRoute(); requestRender();
});
function sheetHtml(sh){
  const t = sh.type;
  if (t==='hub') return hubSheetHtml();
  if (t==='cup') return cupSheetHtml();
  if (t==='gloss') return `<h3>Match play, translated</h3>
    <div style="font-size:14.5px;line-height:1.6">
    <b>2UP</b> — leading by two holes. <b>A/S</b> — all square, tied.<br>
    <b>THRU 12</b> — twelve holes finished.<br>
    <b>DORMIE</b> — up by exactly as many holes as remain: can’t lose, worst case a halved match.<br>
    <b>4&amp;3</b> — won four-up with three to play; the match ended on 15.<br>
    <b>HALVED</b> — tied after 18. ½ point each. No extra holes — ever.<br>
    <b>Concession</b> — “that’s good” is binding and can’t be taken back.</div>`;
  if (t==='pill'){
    if (!dbConfigured()) return `<h3>Range mode</h3><div>Range mode — nothing’s saving to the group. Add the trip link in Settings to go live.</div>
      <div class="btnrow"><button class="bigbtn pri" data-act="settings">Open settings</button></div>`;
    if (pend.length) return `<h3>${pend.length} queued</h3><div>Scores are safe on this phone. They’ll send when the mountain allows.</div>`;
    return `<h3>Sync</h3><div>Live — every phone with the link sees scores as they land.</div>`;
  }
  if (t==='badge21') return `<h3>2 v 1</h3><div>Odd man out — one ball counts for the solo side. Totally legal (Rule 23). His allowance computes off the low man of the three.</div>`;
  if (t==='ovf'){
    const m = theMatch(sh.mid); const dr = m ? mDer(m) : null;
    return `<h3>Match options</h3>
      ${dr && !dr.st.done ? `<button class="hubrow" data-act="concede1" data-mid="${sh.mid}"><div class="hl">Concede match…</div></button>`:''}
      ${dr && dr.st.done ? `<button class="hubrow" data-act="reopen" data-mid="${sh.mid}"><div class="hl">Reopen match</div></button>`:''}
      <button class="hubrow" data-act="setup" data-d="${m?m.day:'fri'}"><div class="hl">Edit pairings</div></button>
      <button class="hubrow" data-act="strokesfall" data-mid="${sh.mid}"><div class="hl">How strokes fall</div></button>`;
  }
  if (t==='strokesfall'){
    const m = theMatch(sh.mid); if (!m) return '';
    const si = mStrokes(m);
    if (!si.net) return `<h3>How strokes fall</h3><div class="mut">Gross match — nobody gets strokes.</div>`;
    let rows = '';
    const hs = holesFor(m.day);
    if (si.kind==='side'){
      for (const s of ['A','B']){ if (!si.sides[s]) continue;
        const list = hs.filter(h=>ENG.dotsOnHole(si.sides[s], h.si, 18)>0).map(h=>h.no).join(', ');
        rows += `<div style="padding:4px 0"><b class="${s==='A'?'tRed':'tBlue'}">${teamName(s)}</b> — ${si.sides[s]} stroke${si.sides[s]>1?'s':''}: holes ${list}</div>`; }
    } else {
      for (const [pid, n] of Object.entries(si.players)){ if (!n) continue;
        const list = hs.filter(h=>ENG.dotsOnHole(n, h.si, 18)>0).map(h=>h.no).join(', ');
        rows += `<div style="padding:4px 0"><b>${pName(pid)}</b> — ${n} stroke${n>1?'s':''}: holes ${list}</div>`; }
      if (!rows) rows = '<div class="mut">Everyone plays off the low man — no strokes in this match.</div>';
    }
    return `<h3>How strokes fall</h3><div style="font-size:14.5px">${rows}</div>`;
  }
  if (t==='concede1'){
    return `<h3>Who’s giving it up?</h3>
      <div class="btnrow">
        <button class="bigbtn red" data-act="concede2" data-mid="${sh.mid}" data-by="A">${esc(teamName('A'))} concede</button>
        <button class="bigbtn blue" data-act="concede2" data-mid="${sh.mid}" data-by="B">${esc(teamName('B'))} concede</button>
      </div>`;
  }
  if (t==='concede2'){
    const m = theMatch(sh.mid); const dr = mDer(m);
    const recv = sh.by==='A'?'B':'A';
    const margin = dr.st.up===0?1:Math.abs(dr.st.up);
    return `<h3>Confirm</h3>
      <div>${teamName(sh.by)} concede. ${teamName(recv)} win ${margin}UP — ${halfTxt(dr.worth)} point${dr.worth===1?'':'s'} to ${teamName(recv)}. This posts to the board.</div>
      <div class="btnrow"><button class="bigbtn ghost" data-act="sheet-close">Back</button>
