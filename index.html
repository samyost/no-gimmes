/* ---- tokens: High Noon (light, default) ---- */
:root{
  --bone:#F5F0E4; --card:#FCF8EF; --ink:#16211B; --sage:#5C6A5E; --pencil:#C9BFA9;
  --red:#C2273D; --red-press:#9E1F31; --red-wash:#FAE7EA;
  --blue:#2158C7; --blue-press:#1A46A0; --blue-wash:#E8EFFA;
  --sagebrush:#77806F; --brass:#8C6A1F; --warn:#95660A; --live:#2E6B3C; --ob:#7A1F1F;
  --cream:#FCF8EF; --scrim:rgba(22,33,27,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bone:#0F1713; --card:#1B231E; --ink:#EFE9DA; --sage:#9AA69C; --pencil:#39443C;
    --red:#FF5F70; --red-press:#D94756; --red-wash:#3A1B21;
    --blue:#7AA5FF; --blue-press:#5E86DD; --blue-wash:#17263F;
    --sagebrush:#8B968B; --brass:#D9B45B; --warn:#E5A93D; --live:#5FBF77; --ob:#E4756F;
    --cream:#10160f; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bone:#0F1713; --card:#1B231E; --ink:#EFE9DA; --sage:#9AA69C; --pencil:#39443C;
  --red:#FF5F70; --red-press:#D94756; --red-wash:#3A1B21;
  --blue:#7AA5FF; --blue-press:#5E86DD; --blue-wash:#17263F;
  --sagebrush:#8B968B; --brass:#D9B45B; --warn:#E5A93D; --live:#5FBF77; --ob:#E4756F;
  --cream:#10160f; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;background:var(--bone);color:var(--ink);
  font:16px/1.45 'Atkinson Hyperlegible','Helvetica Neue',system-ui,sans-serif;
  min-height:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
.sc{font-family:'Saira Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums lining-nums}
.num{font-variant-numeric:tabular-nums lining-nums}
#app{max-width:560px;margin:0 auto;padding-bottom:40px}
.mut{color:var(--sage)}
.brass{color:var(--brass)}
.caps{text-transform:uppercase;letter-spacing:.04em}
a{color:var(--brass)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- app bar ---- */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  height:46px;padding:0 12px;background:var(--bone);border-bottom:1px solid var(--pencil)}
.wordmark{font-family:'Saira Condensed';font-weight:800;font-size:17px;letter-spacing:.06em;
  border-bottom:2px solid var(--brass);padding-bottom:1px}
.appbar .sp{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--card);border:2px solid var(--sagebrush)}
.avatar.red{border-color:var(--red)} .avatar.blue{border-color:var(--blue)}
.backbtn{width:48px;height:44px;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;margin-left:-12px;padding-bottom:4px}

/* ---- sync pill ---- */
.pill{font-family:'Saira Condensed';font-weight:700;font-size:11.5px;letter-spacing:.05em;
  padding:4px 9px;border-radius:99px;border:1px solid var(--pencil);background:var(--card);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live)}
.pill.q{color:var(--warn);border-color:var(--warn)} .pill.q .dot{background:var(--warn)}
.pill.rm{color:var(--brass);border-color:var(--brass)} .pill.rm .dot{background:var(--brass)}
.pill.sy .dot{background:var(--sage);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---- cup header ---- */
.cuphead{position:sticky;top:46px;z-index:29;background:var(--bone);padding:8px 14px 6px;border-bottom:1px solid var(--pencil);cursor:pointer}
.cupline{display:flex;align-items:baseline;justify-content:center;gap:12px}
.cupline .tn{font-family:'Saira Condensed';font-weight:700;font-size:15px;letter-spacing:.08em}
.cupline .pts{font-family:'Saira Condensed';font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.cupline .dash{font-family:'Saira Condensed';font-weight:600;font-size:26px;color:var(--sage)}
.tRed{color:var(--red)} .tBlue{color:var(--blue)}
.frac{font-size:.6em;vertical-align:.25em}
.tug{position:relative;height:12px;border-radius:6px;border:1px solid var(--pencil);background:var(--bone);margin:7px 0 4px;overflow:visible}
.tug .seg{position:absolute;top:0;bottom:0}
.tug .aR{left:0;background:var(--red);border-radius:5px 0 0 5px;transition:width .4s ease-out}
.tug .aB{right:0;background:var(--blue);border-radius:0 5px 5px 0;transition:width .4s ease-out}
.tug .pR{background:repeating-linear-gradient(45deg,var(--red) 0 4px,transparent 4px 8px);opacity:.55}
.tug .pB{background:repeating-linear-gradient(45deg,var(--blue) 0 4px,transparent 4px 8px);opacity:.55}
.tug .tick{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--brass)}
.tug .tick.retain{top:0;bottom:0;width:2px;opacity:.8}
.ticklab{position:absolute;top:-16px;transform:translateX(-50%);font-family:'Saira Condensed';font-weight:700;font-size:11px;color:var(--brass)}
.cupsub{text-align:center;font-size:11px;color:var(--sage)}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 0 0 0 transparent}}
.ticked{animation:tick .2s ease-out}
@keyframes tick{50%{transform:scale(1.12)}}
/* condensed cup strip */
.cupstrip{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:44px;
  padding:0 10px;background:var(--bone);border-bottom:1px solid var(--pencil)}
.cupstrip .mini{font-family:'Saira Condensed';font-weight:800;font-size:16px}
.cupstrip .tug{flex:1;height:5px;margin:0;border-radius:3px}

/* ---- day bar: one picker pill + today's context ---- */
.daybar{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.daypick{display:inline-flex;align-items:baseline;gap:7px;border:1.5px solid var(--ink);border-radius:10px;
  padding:5px 10px 5px 12px;background:var(--card);min-height:40px}
.daypick .d1{font-family:'Saira Condensed';font-weight:800;font-size:19px;letter-spacing:.05em}
.daypick .d2{font-family:'Saira Condensed';font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--sage)}
.daypick .d2.today{color:var(--brass)}
.daypick .caret{font-size:12px;color:var(--sage);align-self:center;margin-left:2px}
.daybar .sp{flex:1}
.daysub{font-family:'Saira Condensed';font-weight:700;font-size:16px;white-space:nowrap}
.dayctx{display:block;width:100%;text-align:left;padding:5px 14px 8px}
.dayctx .c1{font-weight:700;font-size:15.5px}
.dayctx .c1 .tbd{color:var(--brass);text-decoration:underline;text-underline-offset:3px}
.dayctx .c2{font-family:'Saira Condensed';font-weight:600;font-size:11.5px;letter-spacing:.05em;color:var(--sage);text-transform:uppercase;margin-top:1px}
.gear{width:46px;height:44px;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;margin-right:-8px}
/* day picker sheet */
.dayrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bone);
  border:1.5px solid var(--pencil);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dayrow.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.dayrow .dl{font-family:'Saira Condensed';font-weight:800;font-size:20px;letter-spacing:.04em;width:50px;line-height:1;flex:0 0 50px}
.dayrow .dl small{display:block;font-size:11px;font-weight:600;color:var(--sage);letter-spacing:.06em;margin-top:2px}
.dayrow .dn{font-weight:700;font-size:14.5px}
.dayrow .dv{font-size:12px;color:var(--sage)}
.dayrow .mk{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dayrow .ring{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--brass)}
.dayrow .win{display:inline-block;width:9px;height:9px;border-radius:50%}
.dayrow .win.red{background:var(--red)} .dayrow .win.blue{background:var(--blue)}
.dayrow .win.split{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}
.dayrow .today{font-family:'Saira Condensed';font-weight:700;font-size:10px;letter-spacing:.1em;color:var(--brass)}

/* ---- tee groups & match rows ---- */
.tgh{padding:12px 14px 4px;font-family:'Saira Condensed';font-weight:600;font-size:12.5px;
  letter-spacing:.05em;color:var(--sage);text-transform:uppercase;border-bottom:1px solid var(--pencil);margin:0 0 8px}
.mlist{padding:0 10px;display:flex;flex-direction:column;gap:8px}
.mrow{position:relative;display:block;width:100%;text-align:inherit;background:var(--card);
  border:1px solid var(--pencil);border-radius:12px;padding:10px 12px 8px}
.mrow .top{display:flex;align-items:center;gap:6px}
.mside{flex:1;min-width:0}
.mside .pl{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mside.lead .pl{font-weight:800}
.mside.R .pl{color:var(--red)} .mside.B .pl{color:var(--blue);text-align:right}
.mcent{flex:0 0 auto;text-align:center;min-width:64px}
.you{font-family:'Saira Condensed';font-weight:700;font-size:10px;color:var(--brass);letter-spacing:.1em}
.thru{font-size:11.5px;color:var(--sage);margin-top:2px}
.thru .stale{color:var(--warn)}
.ptlab{position:absolute;right:4px;top:50%;transform:translateY(-50%) rotate(90deg);
  font-family:'Saira Condensed';font-weight:600;font-size:9.5px;color:var(--sage);letter-spacing:.1em}
.subline{font-size:12px;color:var(--sage);margin-top:3px}
.holestrip{display:flex;gap:2px;margin-top:7px}
.hs{width:100%;max-width:8px;height:6px;border:1px solid var(--pencil);border-radius:1.5px;background:transparent;position:relative;flex:1}
.hs.A{background:var(--red);border-color:var(--red)} .hs.B{background:var(--blue);border-color:var(--blue)}
.hs.H{background:var(--sagebrush);border-color:var(--sagebrush)}
.hs.x{opacity:.4}
.hs.drift{outline:2px solid var(--warn);outline-offset:-1px}
.cell .fill.drift{outline:2px solid var(--warn);outline-offset:-1px}
.hs.ov::after{content:'';position:absolute;right:0;top:0;border-style:solid;border-width:0 3px 3px 0;border-color:transparent var(--cream) transparent transparent}
.glow{animation:glowp 2s ease-out}
@keyframes glowp{0%{background-color:var(--red-wash)}100%{background-color:var(--card)}}
.glowB{animation:glowb 2s ease-out}
@keyframes glowb{0%{background-color:var(--blue-wash)}100%{background-color:var(--card)}}
.badge{font-family:'Saira Condensed';font-weight:700;font-size:10px;padding:1px 6px;border:1px solid var(--sage);
  color:var(--sage);border-radius:4px;letter-spacing:.06em}
.dayfoot{padding:12px 14px;font-size:13.5px;color:var(--sage)}
.empty{padding:28px 20px;text-align:center;color:var(--sage);font-size:15px}
.cta{display:inline-block;margin-top:12px;font-family:'Saira Condensed';font-weight:700;font-size:15px;
  letter-spacing:.05em;color:var(--cream);background:var(--ink);border-radius:10px;padding:12px 20px;text-transform:uppercase}
:root[data-theme="dark"] .cta{color:var(--bone)}

/* ---- status chips ---- */
.chip{display:inline-flex;align-items:center;justify-content:center;font-family:'Saira Condensed';
  font-weight:700;letter-spacing:.03em;border-radius:6px;padding:3px 10px;font-size:15px;min-height:26px;color:var(--cream)}
.chip.R{background:var(--red)} .chip.B{background:var(--blue)}
.chip.as{background:var(--card);border:2px solid var(--ink);color:var(--ink)}
.chip.dormie{border:2px solid var(--brass)}
.chip.fin{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip.halv{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}
.chip.tee{background:var(--card);border:1px solid var(--pencil);color:var(--sage)}
.chip .pre{font-size:11px;margin-right:3px;opacity:.9}

/* ---- match screen ---- */
.mhead{padding:10px 14px 4px;position:relative}
.mhead .pair{display:flex;align-items:baseline;gap:8px}
.mhead .pn{flex:1;font-size:17px;font-weight:700;min-width:0}
.mhead .pn.R{color:var(--red)} .mhead .pn.B{color:var(--blue);text-align:right}
.mhead .vs{color:var(--sage);font-size:13px}
.mmeta{font-size:11px;color:var(--sage);letter-spacing:.05em;text-transform:uppercase;margin-top:3px;display:flex;align-items:center;gap:8px}
.mmeta .meta{flex:1;min-width:0}
.mmeta .mst{flex:0 0 auto;font-family:'Saira Condensed';font-weight:700;font-size:12px;color:var(--ink);white-space:nowrap}
.mmeta .mst.R{color:var(--red)} .mmeta .mst.B{color:var(--blue)} .mmeta .mst .d{color:var(--brass)}
.dots{display:flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--pencil)}
.dots i.on{background:var(--ink)}
.ovf{position:absolute;right:6px;top:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--sage)}
.finpanel{margin:0 14px 8px;border-radius:12px;padding:12px;text-align:center;color:var(--cream);
  font-family:'Saira Condensed';font-weight:800;font-size:30px}
.finpanel.R{background:var(--red)} .finpanel.B{background:var(--blue)} .finpanel.H{background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%)}

/* ---- hole rail ---- */
.railwrap{overflow-x:auto;scroll-snap-type:x proximity;border-top:1px solid var(--pencil);border-bottom:1px solid var(--pencil);background:var(--card);-webkit-overflow-scrolling:touch}
.rail{display:flex;min-width:max-content;padding:6px 8px;gap:3px;align-items:stretch}
.cell{scroll-snap-align:center;width:46px;min-width:46px;border-radius:8px;border:1px solid transparent;
  padding:3px 0 0;text-align:center;position:relative}
.cell.cur{border-color:var(--ink);background:var(--bone)}
.cell .hn{font-family:'Saira Condensed';font-weight:700;font-size:14px;line-height:1.1}
.cell .hp{font-size:10px;color:var(--sage)}
.cell .sdots{height:7px;display:flex;justify-content:center;gap:2px;align-items:center}
.cell .sdots i{width:5px;height:5px;border-radius:50%}
.cell .sdots i.r{background:var(--red)} .cell .sdots i.b{background:var(--blue)}
.cell .fill{height:22px;margin:2px 3px 3px;border-radius:5px;border:1px solid var(--pencil);position:relative}
.cell .fill.A{background:var(--red);border-color:var(--red)}
.cell .fill.B{background:var(--blue);border-color:var(--blue)}
.cell .fill.H{background:var(--sagebrush);border-color:var(--sagebrush)}
.cell .fill.x{opacity:.4}
.cell .fill .sg{position:absolute;left:2px;bottom:1px;font-size:8px}
.cell .fill.ov::after{content:'';position:absolute;right:1px;top:1px;border-style:solid;border-width:0 6px 6px 0;border-color:transparent var(--cream) transparent transparent}
.cell.pulse .fill{animation:cellpulse .35s ease-out}
@keyframes cellpulse{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.ninediv{display:flex;align-items:center;padding:0 4px;font-family:'Saira Condensed';font-weight:700;
  font-size:10px;color:var(--sage);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.1em}
.gline{font-size:11px;color:var(--sage);text-align:center;padding:2px 0;background:var(--card)}

/* ---- hole context + pad ---- */
.hctx{padding:8px 14px 4px}
.hctx .h1{font-family:'Saira Condensed';font-weight:700;font-size:15.5px;letter-spacing:.04em}
.spills{margin-top:5px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.spills .spl{font-family:'Saira Condensed';font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--sage);margin-right:2px}
.spill{border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;display:inline-block}
.spill.r{background:var(--red-wash);color:var(--red)}
.spill.b{background:var(--blue-wash);color:var(--blue)}
.junkchips{display:flex;gap:6px;padding:6px 14px 0;flex-wrap:wrap}
.jchip{font-family:'Saira Condensed';font-weight:600;font-size:11.5px;letter-spacing:.06em;
  border:1px dashed var(--sage);color:var(--sage);border-radius:99px;padding:4px 10px;text-transform:uppercase}
.pad{position:sticky;bottom:0;background:var(--bone);border-top:1px solid var(--pencil);
  padding:6px 12px calc(12px + env(safe-area-inset-bottom));margin-top:8px}
.padbar{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 0 5px}
.padbar .sp{flex:1}
.drawerh{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;border:1.5px solid var(--pencil);
  background:var(--card);font-family:'Saira Condensed';font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--sage);text-transform:uppercase}
.drawerh.open{color:var(--ink);border-color:var(--ink)}
.editrib{display:flex;align-items:center;gap:10px;font-family:'Saira Condensed';font-weight:700;
  font-size:12px;letter-spacing:.05em;color:var(--brass);text-transform:uppercase;min-width:0}
.editrib span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* one row: RED · HALVE · BLUE — thumb-sized, not billboard-sized */
.winrow{display:flex;gap:6px}
.wbtn{flex:1;min-width:0;height:60px;border-radius:12px;color:#FCF8EF;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;padding:0 4px}
.wbtn .wl{font-family:'Saira Condensed';font-weight:800;font-size:19px;letter-spacing:.07em;line-height:1.1}
.wbtn .wn{font-family:'Saira Condensed';font-weight:600;font-size:10px;letter-spacing:.07em;opacity:.9;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn.R{background:var(--red)} .wbtn.R:active{background:var(--red-press)}
.wbtn.B{background:var(--blue)} .wbtn.B:active{background:var(--blue-press)}
.wbtn.H{background:var(--card);border:2px solid var(--ink);color:var(--ink)}
.wbtn.lit{box-shadow:0 0 0 3px var(--brass);animation:lit 1.2s infinite}
@keyframes lit{50%{box-shadow:0 0 0 5px var(--brass)}}
.winrow.locked .wbtn{opacity:.6;pointer-events:none}
/* drawer */
.drawer{padding-bottom:4px}
.dbanner{border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:700;margin-bottom:8px;text-align:center}
.dbanner.r{background:var(--red-wash);color:var(--red)} .dbanner.b{background:var(--blue-wash);color:var(--blue)}
.dbanner.h{background:var(--bone);border:1px solid var(--sagebrush);color:var(--sagebrush)}
.dbanner.w{background:var(--bone);border:1px dashed var(--pencil);color:var(--sage)}
.srow{display:flex;align-items:center;gap:5px;padding:5px 0;border-radius:10px;margin:0 -4px;padding-left:4px;padding-right:4px}
.srow.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--brass)}
.srow.picked .qnums{opacity:.35}
.srow .who{flex:0 0 72px;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-align:left;padding:6px 0}
.srow .who.r{color:var(--red)} .srow .who.b{color:var(--blue)}
.srowsub{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:-3px 0 2px;padding-right:2px}
.qnums{display:flex;gap:4px;flex:1;justify-content:flex-end}
.qn{width:38px;height:44px;border-radius:9px;border:1.5px solid var(--pencil);
  font-family:'Saira Condensed';font-weight:700;font-size:19px;color:var(--ink);background:var(--card)}
.qn.ghost{border-style:dashed;color:var(--sage)}
.qn.set.r{background:var(--red);border-color:var(--red);color:#FCF8EF}
.qn.set.b{background:var(--blue);border-color:var(--blue);color:#FCF8EF}
.qn.step{font-size:16px;width:30px}
.netlab{font-size:12px;color:var(--brass);font-weight:700;white-space:nowrap}
.pickup{font-size:12px;color:var(--sage);text-decoration:underline;text-underline-offset:2px}
.usemap{font-size:12px;color:var(--brass);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.padnote{font-size:12.5px;color:var(--sage);text-align:center;padding-top:6px}
.resultcard{border-radius:14px;border:1px solid var(--pencil);background:var(--card);padding:14px;text-align:center}
.resultcard .r1{font-family:'Saira Condensed';font-weight:800;font-size:24px}
.resultcard .links{margin-top:8px;display:flex;justify-content:center;gap:18px;font-size:14px}
.resultcard .links button{color:var(--brass);text-decoration:underline;text-underline-offset:3px}
.funban{border:1px solid var(--brass);color:var(--brass);border-radius:8px;padding:5px 10px;
  font-size:12.5px;text-align:center;margin-bottom:8px;font-weight:700}

/* ---- ledger ---- */
.ledger{padding:8px 14px 90px}
.ledger table{width:100%;border-collapse:collapse;font-size:13px}
.ledger th{font-family:'Saira Condensed';font-weight:600;font-size:11px;color:var(--sage);
  text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:4px 6px;border-bottom:1px solid var(--pencil)}
.ledger td{padding:4px 6px;border-bottom:1px solid var(--pencil)}
.ledger .n{color:var(--sage);font-size:12px}
.wtag{font-family:'Saira Condensed';font-weight:700}
.wtag.A{color:var(--red)} .wtag.B{color:var(--blue)} .wtag.H{color:var(--sagebrush)}

/* ---- sheets, snack, takeover ---- */
#sheetlayer{position:fixed;inset:0;z-index:60;display:none}
#sheetlayer.open{display:block}
#sheetlayer .scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--card);
  border-radius:18px 18px 0 0;border-top:1px solid var(--pencil);padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30%)}to{transform:translateY(0)}}
.sheet h3{font-family:'Saira Condensed';font-weight:700;font-size:17px;letter-spacing:.05em;margin:2px 0 10px;text-transform:uppercase}
.sheet .btnrow{display:flex;gap:8px;margin-top:14px}
.bigbtn{flex:1;min-height:52px;border-radius:12px;font-family:'Saira Condensed';font-weight:700;
  font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:8px}
.bigbtn.pri{background:var(--ink);color:var(--bone)}
.bigbtn.red{background:var(--red);color:#FCF8EF} .bigbtn.blue{background:var(--blue);color:#FCF8EF}
.bigbtn.ghost{border:2px solid var(--ink)}
.bigbtn.danger{background:var(--ob);color:#FCF8EF}
#snack{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));z-index:70;display:flex;justify-content:center;pointer-events:none}
.snackin{pointer-events:none;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bone);
  border-radius:10px;padding:10px 16px;font-size:14.5px;max-width:92%;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.snackin button{pointer-events:auto;color:var(--brass);font-family:'Saira Condensed';font-weight:700;letter-spacing:.08em;font-size:14px}
#takeover{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#takeover.open{display:flex;animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:0}}
#takeover.red{background:var(--red)} #takeover.blue{background:var(--blue)} #takeover.neutral{background:var(--ink)}
#takeover .big{font-family:'Saira Condensed';font-weight:800;font-size:44px;color:#FCF8EF;line-height:1.1;text-wrap:balance}
#takeover .sub{color:#FCF8EF;opacity:.92;margin-top:10px;font-size:17px}
#takeover .cont{margin-top:26px;border:2px solid #FCF8EF;color:#FCF8EF;border-radius:10px;padding:12px 26px;
  font-family:'Saira Condensed';font-weight:700;font-size:16px;letter-spacing:.08em}

/* ---- who-are-you ---- */
.whowrap{position:fixed;inset:0;z-index:50;background:var(--bone);overflow-y:auto;padding:26px 18px calc(20px + env(safe-area-inset-bottom))}
.whowrap .wm{text-align:center}
.whowrap h1{font-family:'Saira Condensed';font-weight:800;font-size:30px;text-align:center;margin:14px 0 4px;letter-spacing:.03em}
.whosub{text-align:center;color:var(--sage);font-size:14px;margin-bottom:18px}
.whogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
.whocard{background:var(--card);border:1px solid var(--pencil);border-radius:14px;padding:14px 8px 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.whocard .em{font-size:38px;line-height:1.15}
.whocard .nm{font-size:17px;font-weight:700;padding-bottom:10px}
.whocard .bar{align-self:stretch;height:6px;background:var(--sagebrush)}
.whocard .bar.red{background:var(--red)} .whocard .bar.blue{background:var(--blue)}
.whofoot{text-align:center;margin-top:20px}
.whofoot button{color:var(--sage);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---- setup ---- */
.spage{padding:0 14px 60px}
.spage h2{font-family:'Saira Condensed';font-weight:700;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.spage h2 .ct{color:var(--sage);font-weight:600;font-size:13px;letter-spacing:.04em}
.block{background:var(--card);border:1px solid var(--pencil);border-radius:12px;padding:12px}
.pchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pchip{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:10px;border:1.5px solid var(--pencil);
  background:var(--bone);padding:4px 10px;font-weight:700;font-size:15px;text-align:left}
.pchip .em{font-size:20px}
.pchip.out{opacity:.5} .pchip.out .nm{text-decoration:line-through}
.pchip.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.pchip.redx{border-color:var(--red);background:var(--red-wash)}
.pchip.bluex{border-color:var(--blue);background:var(--blue-wash)}
.teamcols{display:flex;gap:10px}
.tcol{flex:1;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:70px}
.tcol.red{background:var(--red-wash)} .tcol.blue{background:var(--blue-wash)}
.tcol h4{margin:0 0 2px;font-family:'Saira Condensed';font-weight:700;font-size:13px;letter-spacing:.08em;text-align:center}
.tcol.red h4{color:var(--red)} .tcol.blue h4{color:var(--blue)}
.ghostbtn{font-size:13.5px;color:var(--sage);border:1.5px dashed var(--sage);border-radius:9px;padding:7px 12px}
.warnchip{display:inline-block;font-size:12.5px;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 9px;font-weight:700}
.fixbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bone);border:1px solid var(--warn);
  border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.fixbar button{color:var(--warn);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.selrow{display:flex;flex-wrap:wrap;gap:6px}
.selopt{border:1.5px solid var(--pencil);border-radius:9px;padding:7px 11px;font-size:14px;font-weight:600;background:var(--bone)}
.selopt.on{border-color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.selopt .sub{display:block;font-size:11px;color:var(--sage);font-weight:400}
.timerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.timerow .gl{font-family:'Saira Condensed';font-weight:700;font-size:14px;letter-spacing:.06em;width:70px}
.timerow input[type=time]{font-family:'Saira Condensed';font-weight:700;font-size:20px;background:var(--bone);
  border:1px solid var(--pencil);border-radius:8px;padding:4px 8px;color:var(--ink)}
.cartgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cartcard{border:1px solid var(--pencil);border-radius:10px;background:var(--bone);padding:8px}
.cartcard h5{margin:0 0 6px;font-family:'Saira Condensed';font-weight:700;font-size:12px;letter-spacing:.08em;
  color:var(--sage);display:flex;justify-content:space-between;align-items:center}
.cartcard h5 .grp{border:1px solid var(--pencil);border-radius:5px;padding:0 5px;font-size:10.5px}
.seat{display:flex;align-items:center;gap:6px;min-height:42px;border:1.5px dashed var(--pencil);
  border-radius:8px;padding:2px 8px;margin-top:5px;font-weight:700;font-size:14px;width:100%;text-align:left}
.seat.filled{border-style:solid;background:var(--card)}
.seat.sel{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.seat .em{font-size:18px}
.bench{margin-top:10px}
.helpers{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.mcard{border:1px solid var(--pencil);border-radius:10px;background:var(--bone);padding:8px 10px;margin-top:8px}
.mcard .row{display:flex;align-items:center;gap:6px}
.mcard .del{margin-left:auto;color:var(--ob);width:36px;height:36px;font-size:17px}
.mslot{border:1.5px solid transparent;border-radius:8px;padding:3px 8px;font-weight:700;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:5px}
.mslot.r{color:var(--red);background:var(--red-wash)} .mslot.b{color:var(--blue);background:var(--blue-wash)}
.mslot.sel{border-color:var(--brass)}
.fmtcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fmtc{flex:0 0 150px;border:1.5px solid var(--pencil);border-radius:10px;background:var(--bone);padding:10px;text-align:left}
.fmtc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.fmtc .fn{font-family:'Saira Condensed';font-weight:700;font-size:14.5px;letter-spacing:.05em}
.fmtc .fd{font-size:11.5px;color:var(--sage);margin-top:3px;line-height:1.35}
.mixcard{display:flex;gap:8px;border:1.5px solid var(--pencil);border-radius:10px;background:var(--bone);padding:9px 10px;margin-top:8px}
.mixcard.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.mixcard .mixmain{flex:1;text-align:left;background:none;border:0;padding:0}
.mixcard .fn{font-family:'Saira Condensed';font-weight:700;font-size:14.5px;letter-spacing:.05em}
.mixcard .fd{font-size:11.5px;color:var(--sage);margin-top:3px;line-height:1.35}
.mixcard .mixedit{align-self:center;font-size:15px;color:var(--sage);border:1.5px solid var(--pencil);border-radius:9px;background:var(--bone);padding:6px 10px}
.stepper{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--pencil);border-radius:9px;background:var(--bone)}
.stepper button{width:42px;height:42px;font-size:20px;color:var(--ink)}
.stepper .v{font-family:'Saira Condensed';font-weight:700;font-size:17px;min-width:44px;text-align:center}
.setupfoot{text-align:center;color:var(--sage);font-size:13px;padding:18px 0 4px}
.togg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--pencil);font-size:15px}
.togg:last-child{border-bottom:none}
.sw{position:relative;width:48px;height:28px;border-radius:99px;background:var(--pencil);transition:background .15s;flex:0 0 48px}
.sw.on{background:var(--live)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.sw.on::after{left:23px}
.field{display:flex;align-items:center;gap:8px;padding:7px 0}
.field label{flex:1;font-size:14.5px}
.field input[type=text],.field input[type=number]{background:var(--bone);border:1px solid var(--pencil);
  border-radius:8px;padding:8px 10px;width:130px;font-size:15px}
.field input.wide{width:100%}
.hubrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--pencil);border-radius:12px;padding:12px;margin-bottom:8px}
.hubrow .hl{font-weight:700;font-size:15.5px}
.hubrow .hv{font-size:12.5px;color:var(--sage)}
.hubrow .chev{margin-left:auto;color:var(--sage);font-size:18px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--pencil)}
.prow:last-child{border-bottom:none}
.prow .embtn{width:44px;height:44px;font-size:22px;background:var(--bone);border:1px solid var(--pencil);border-radius:9px}
.prow input.nm{flex:1;min-width:0;background:var(--bone);border:1px solid var(--pencil);border-radius:8px;padding:9px 10px;font-size:15px}
.prow input.hcp{width:74px;background:var(--bone);border:1px solid var(--pencil);border-radius:8px;padding:9px 8px;font-size:15px}
.prow .ch{font-size:11px;color:var(--sage);width:64px}
.prow .rm{color:var(--ob);width:36px;height:44px;font-size:17px}
.empick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.empick button{font-size:26px;height:48px;border-radius:10px;background:var(--bone);border:1px solid var(--pencil);position:relative}
.empick button.taken{opacity:.35}
.empick button .tk{position:absolute;bottom:1px;left:0;right:0;font-size:8px;color:var(--sage)}
.mvptable{width:100%;border-collapse:collapse;font-size:14.5px}
.mvptable th{font-family:'Saira Condensed';font-weight:600;font-size:11px;color:var(--sage);text-transform:uppercase;
  letter-spacing:.06em;text-align:right;padding:5px 6px;border-bottom:1px solid var(--pencil)}
.mvptable th:first-child{text-align:left}
.mvptable td{padding:6px;border-bottom:1px solid var(--pencil);text-align:right;font-variant-numeric:tabular-nums}
.mvptable td:first-child{text-align:left;font-weight:700}
.agr{margin-top:14px;border:1px solid var(--brass);border-radius:10px;padding:10px 12px;font-size:13.5px}
.agr h4{margin:0 0 6px;font-family:'Saira Condensed';font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--brass);text-transform:uppercase}
.agr div{padding:2px 0}
.banner{margin:8px 14px 0;border:1px solid var(--brass);color:var(--brass);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600}
.final .cupline .pts.win{text-shadow:0 0 0}
.engrave{text-align:center;font-family:'Saira Condensed';font-weight:800;font-size:20px;letter-spacing:.05em;
  padding:4px 0 2px;color:var(--brass);text-transform:uppercase}
/* ---- lo-fi hole maps ---- */
.hmap{margin:8px 14px 0;position:relative}
.hmap svg{display:block;width:100%;height:auto;border:1px solid var(--pencil);border-radius:10px;background:var(--bone)}
.hmap .mr{fill:var(--sage);opacity:.10}
.hmap .mf{fill:var(--sage);opacity:.22}
.hmap .mg{fill:var(--live);opacity:.30}
.hmap .mt{fill:var(--pencil);opacity:.65}
.hmap .mb{fill:var(--brass);opacity:.38}
.hmap .mw{fill:var(--blue);opacity:.20}
.hmap .mc{fill:none;stroke:var(--pencil);stroke-width:1.5;stroke-dasharray:4 5}
.hmap .bmark circle{stroke:var(--card);stroke-width:1.5}
.hmap .bmark.r circle{fill:var(--red)}
.hmap .bmark.b circle{fill:var(--blue)}
.hmap .bmark text{font-size:9px;text-anchor:middle;dominant-baseline:central}
.hmap .bmark.dim{opacity:.45}
.hmap .bmark.sel circle{stroke:var(--brass);stroke-width:2}
.hmap .bmark.sel text{fill:#FCF8EF;font-weight:700;font-family:'Saira Condensed';font-size:11px}
.hmap .bmark.hole circle{fill:none;stroke:var(--brass);stroke-width:2}
.hmap .pinring{fill:var(--brass);fill-opacity:.12;stroke:var(--brass);stroke-width:1;stroke-dasharray:2 2;opacity:.8}
.hmap .tr{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.7}
.hmap .tr.r{stroke:var(--red)} .hmap .tr.b{stroke:var(--blue)}
.hmap .mhint{position:absolute;right:9px;bottom:5px;font-size:10.5px;color:var(--sage);letter-spacing:.04em;pointer-events:none;
  background:var(--bone);padding:1px 5px;border-radius:6px;max-width:70%;text-align:right;line-height:1.35}
.mlead{padding:6px 14px 0;font-size:12.5px;color:var(--sage);letter-spacing:.02em}
.hmap .inbtn{cursor:pointer}
.hmap .inbtn rect{fill:var(--ink);stroke:var(--bone);stroke-width:1.5}
.hmap .inbtn text{fill:var(--bone);font-family:'Saira Condensed';font-weight:800;font-size:11px;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
.hmap .inbtn:active rect,.hmap .inbtn:focus-visible rect{fill:var(--brass)}
.hmap .inbtn:focus{outline:none}
.gchips{display:flex;gap:6px;padding:6px 14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:0 0 auto;font-size:13px;font-weight:700;border:1.5px solid var(--pencil);border-radius:99px;padding:5px 10px;color:var(--sage);background:var(--card);white-space:nowrap}
.gchip.r{color:var(--red)} .gchip.b{color:var(--blue)}
.gchip.sel.r{background:var(--red);border-color:var(--red);color:#FCF8EF}
.gchip.sel.b{background:var(--blue);border-color:var(--blue);color:#FCF8EF}
.gchip .ct{opacity:.85;font-weight:600;margin-left:4px}
.tracebar{padding:5px 14px 0}
.tracebar .rorow{display:flex;align-items:baseline;gap:10px;min-height:20px}
.tracebar .ro{font-family:'Saira Condensed';font-weight:700;font-size:13.5px;letter-spacing:.05em;color:var(--ink);text-transform:uppercase}
.tracebar .ro .mut{font-family:inherit;font-weight:600}
.tracebar .tbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.tbtn{font-family:'Saira Condensed';font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1.5px solid var(--ink);border-radius:9px;padding:0 10px;height:36px;color:var(--ink);background:var(--card);white-space:nowrap}
.tbtn.go{background:var(--ink);color:var(--bone)}
.tbtn.lite{border-color:var(--pencil);color:var(--sage)}
.tbtn.undo{width:40px;padding:0;font-size:16px}
.tracebar .clr{color:var(--ob);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.hnote{margin:6px 14px 0;font-size:12.5px;color:var(--sage);display:flex;gap:7px;align-items:center;line-height:1.4}
.hnote input{flex:1;background:var(--bone);border:1px solid var(--pencil);border-radius:8px;padding:7px 10px;font-size:13.5px}
.hnotebtn{color:var(--brass);font-size:11.5px;border:1px dashed var(--pencil);border-radius:8px;padding:3px 8px;flex:0 0 auto}
</style>

/* ===ENGINE=== */
const ENG = (() => {
  // ---- match play status ------------------------------------------------
  // holes: object {holeNo: {w: 'A'|'B'|'H'}} — only entered holes present.
  // order: array of hole numbers in play order (e.g. [1..18] or [10..18,1..9]).
  // concession: null | {by:'A'|'B', afterThru:int} — side that conceded the match.
  // Returns the full derived state; "for fun" holes after the match is decided
  // are ignored for the result but still counted in wonA/wonB display tallies.
  function matchState(holes, order, concession) {
    // Full-pass semantics: EVERY scored hole counts, gaps included — a hole
    // cleared or skipped mid-round must not hide later results. `remaining`
    // is the count of unscored holes at that point in the walk (earlier gaps
    // included), which is exactly the set the trailing side could still win.
    const n = order.length;
    let up = 0; // + means A leads
    let thru = 0; // holes decided so far (count, not prefix)
    let decidedAt = 0; // hole number (in play order) where the match was decided
    let result = null; // {winner:'A'|'B'|null, text, margin, closed}
    let wonA = 0, wonB = 0, halved = 0;
    for (let i = 0; i < n; i++) {
      const h = holes[order[i]];
      if (!h || !h.w) continue;
      if (h.w === 'A') { wonA++; up++; } else if (h.w === 'B') { wonB++; up--; } else halved++;
      thru++;
      const remaining = n - thru;
      if (!result && Math.abs(up) > remaining) {
        decidedAt = order[i];
        const margin = Math.abs(up);
        const toPlay = n - 1 - i; // holes after the closing hole, in sequence
        result = {
          winner: up > 0 ? 'A' : 'B',
          margin,
          closed: remaining > 0,
          text: remaining > 0 && toPlay > 0 ? `${margin}&${toPlay}` : (margin === 1 ? '1UP' : `${margin}UP`),
        };
      }
      if (!result && thru === n) {
        decidedAt = order[i];
        result = up === 0
          ? { winner: null, margin: 0, closed: false, text: 'HALVED' }
          : { winner: up > 0 ? 'A' : 'B', margin: Math.abs(up), closed: false, text: `${Math.abs(up)}UP` };
      }
    }
    if (concession && !result) {
      // margin is stated for the RECEIVING side; conceding while level or
      // ahead records the minimum 1UP for the receiver.
      const winner = concession.by === 'A' ? 'B' : 'A';
      const winnerUp = winner === 'A' ? up : -up;
      const margin = Math.max(1, winnerUp);
      result = {
        winner,
        margin,
        closed: true,
        conceded: true,
        text: `${margin}UP`,
      };
      decidedAt = thru;
    }
    const remaining = n - thru;
    const dormie = !result && up !== 0 && Math.abs(up) === remaining && remaining > 0;
    return {
      up, thru, remaining, wonA, wonB, halved, dormie, decidedAt,
      done: !!result, result,
      statusText: result ? result.text
        : up === 0 ? 'A/S'
        : `${Math.abs(up)}UP`,
      leader: result ? result.winner : (up > 0 ? 'A' : up < 0 ? 'B' : null),
    };
  }

  // Points a finished match yields: [ptsA, ptsB] out of `worth`.
  function matchPoints(state, worth) {
    if (!state.done) return [0, 0];
    if (state.result.winner === 'A') return [worth, 0];
    if (state.result.winner === 'B') return [0, worth];
    return [worth / 2, worth / 2];
  }

  // Projected points while live: leader gets the full match, A/S splits.
  function projectedPoints(state, worth) {
    if (state.done) return matchPoints(state, worth);
    if (state.leader === 'A') return [worth, 0];
    if (state.leader === 'B') return [0, worth];
    return [worth / 2, worth / 2];
  }

  // ---- handicaps --------------------------------------------------------
  // WHS allowance presets by format (percent of course handicap).
  // side handicap construction differs by format:

function effStrokes(m, n){
  const hd = (m.holes||{})[n] || {};
  const out = Object.assign({}, hd.strokes||{});
  for (const k of traceKeys(m, n)){
    if (out[k] != null) continue;
    const ti = traceInfo(traceFor(m, n, k));
    if (ti.complete) out[k] = ti.n;
  }
  return Object.keys(out).length ? out : null;
}
function tracePath(m, n, key){ return `matches/${m.id}/holes/${n}/trace/${key}`; }
function setTrace(m, n, key, list, noUndo){
  if (!noUndo){
    const k = m.id+'/'+n+'/'+key;
    (ui.traceUndo[k] = ui.traceUndo[k] || []).push(traceFor(m, n, key));
    if (ui.traceUndo[k].length > 30) ui.traceUndo[k].shift();
  }
  op(tracePath(m, n, key), list.length ? list : null);
  op(`matches/${m.id}/touched`, Date.now());
}
function addStroke(m, n, key, stroke){
  const list = traceFor(m, n, key), ti = traceInfo(list);
  if (ti.complete) return false;
  if (ti.rev) list.unshift(stroke); else list.push(stroke);
  setTrace(m, n, key, list);
  return true;
}
// map taps within this many viewBox units of the flag count as holing out
const PIN_R = 16;
// the holing stroke closes the trace. Traces only build forward now (tee to
// pin); a legacy putt-back-to-tee build still closes here. From an empty
// trace this is an ace — real, but worth a second look, so it carries UNDO.
function holeOut(m, n, key){
  const list = traceFor(m, n, key), ti = traceInfo(list);
  if (ti.complete) return;
  if (ti.rev){ list[0].t = 1; setTrace(m, n, key, list); return; }
  list.push({ h:1 });
  setTrace(m, n, key, list);
  if (!ti.started) snack(`Hole-in-one for ${keyShort(m, key)}?!`, 'UNDO', ()=>{ const mm = theMatch(m.id); if (mm) setTrace(mm, n, key, [], true); });
}
// ---- golfer selection (who the map / tally buttons score for) --------------
function defaultSel(m, n){
  const me = LS.get('id', null);
  if (!me || me === 'watch') return null;
  const a = sideIds(m,'A').includes(me), b = sideIds(m,'B').includes(me);
  if (!a && !b) return null;
  return isOneBall(mFormat(m, n)) ? (a ? 'A' : 'B') : me;
}
function selKey(m, n){
  const s = ui.sel[m.id];
  const key = (s && s.n === n) ? s.key : defaultSel(m, n);
  return key && traceKeys(m, n).includes(key) ? key : null;
}
function keyLabel(m, key){ return (key==='A'||key==='B') ? teamName(key) : pName(key); }
function keySide(m, key){ return (key==='A'||key==='B') ? key : (sideIds(m,'A').includes(key) ? 'A' : 'B'); }
// derived winner from effective strokes on a hole (null if underivable)
function derivedWinner(m, holeNo){
  const strokes = effStrokes(m, holeNo); if (!strokes) return null;
  const fmt = mFormat(m, holeNo);
  const si = mStrokes(m, fmt);
  const hs = holesFor(m.day)[holeNo-1];
  const sp = { A: sideIds(m,'A'), B: sideIds(m,'B') };
  let entry;
  if (isOneBall(fmt)){
    if (strokes.A == null || strokes.B == null) return null;
    entry = { sides: strokes };
  } else {
    // completeness gate: a side counts as "in" once it has a numeric score,
    // or as picked up once EVERY entered ball on it is a pickup — a side
    // nobody has entered anything for is not yet derivable, never a loss.
    for (const side of ['A','B']){
      const ids = sp[side];
      const numeric = ids.some(pid => typeof strokes[pid] === 'number');
      const allPick = ids.length > 0 && ids.every(pid => strokes[pid] === 'pickup');
      if (!numeric && !allPick) return null;
    }
    entry = { players:{} };
    for (const [pid,v] of Object.entries(strokes)) if (v !== 'pickup' && v != null) entry.players[pid] = v;
  }
  return ENG.holeWinnerFromStrokes(fmt, entry, sp, si, hs.si, 18);
}
function overridden(m, holeNo){
  const h = (m.holes||{})[holeNo];
  if (!h || !h.winner || h.via !== 'tap') return false;
  const dw = derivedWinner(m, holeNo);
  return dw != null && dw !== h.winner;
}

// ---- cup math --------------------------------------------------------------
function cup(){
  let red=0, blue=0, pRed=0, pBlue=0, scheduled=0, liveLed = {red:0, blue:0};
  for (const m of allMatches()){
    if (m.side) continue; // grudge matches never touch the cup
    const dr = mDer(m); scheduled += dr.worth;
    red += dr.pts[0]; blue += dr.pts[1];
    // only STARTED matches project — unstarted ones are the bone gap in the bar
    if (dr.st.done || dr.st.thru > 0){ pRed += dr.proj[0]; pBlue += dr.proj[1]; }
    if (!dr.st.done && dr.st.leader==='A') liveLed.red++;
    if (!dr.st.done && dr.st.leader==='B') liveLed.blue++;
  }
  const c = cfg();
  const t = ENG.cupTargets(scheduled || 1, c.holder || null);
  return { red, blue, pRed, pBlue, scheduled, win: t.win, retain: t.retain, holder: c.holder, liveLed };
}
function dayPts(d){
  let red=0, blue=0, done=true, any=false;
  for (const m of cupMatchesFor(d)){ any=true; const dr=mDer(m); red+=dr.pts[0]; blue+=dr.pts[1]; if (!dr.st.done) done=false; }
  return { red, blue, done: done&&any, any };
}
function mvpRows(){
  const rows = {};
  for (const p of namedPlayers()) rows[p.id] = { p, w:0, l:0, h:0, pts:0, played:0 };
  for (const m of allMatches()){
    if (m.side) continue; // MVP is a cup record
    const dr = mDer(m); if (!dr.st.done) continue;
    const winSide = dr.st.result.winner;
    ['A','B'].forEach(side => {
      for (const pid of sideIds(m, side)){
        const r = rows[pid]; if (!r) continue;
        r.played++;
        if (winSide === null){ r.h++; r.pts += dr.worth/2; }
        else if (winSide === side){ r.w++; r.pts += dr.worth; }
        else r.l++;
      }
    });
  }
  return Object.values(rows).sort((a,b)=> b.pts-a.pts || b.w-a.w || a.p.ord-b.p.ord);
}

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function resolveDay(){
  const t = todayISO();
  for (const d of DAYS) if (DAYMETA[d].date === t) return d;
  if (t < DAYMETA.fri.date) return 'fri';
  return 'mon';
}
function tripOver(){ return todayISO() > DAYMETA.mon.date; }
function isFutureDay(d){ return DAYMETA[d].date > todayISO(); }
function isToday(d){ return DAYMETA[d].date === todayISO(); }

function dbUrl(){
  const o = LS.get('db', null);
  return (o != null ? o : CONFIG.dbUrl).replace(/\/+$/,'');
}
function dbConfigured(){ return !!dbUrl(); }
function pathUrl(p){ return dbUrl() + '/' + CONFIG.dbPath + (p ? '/'+p : '') + '.json'; }

function applyPath(path, value){
  if (!path){ S = (value && typeof value==='object' && !Array.isArray(value)) ? value : {}; return; }
  const segs = path.split('/');
  if (segs.some(s => s === '__proto__' || s === 'constructor' || s === 'prototype')) return;
  let node = S;
  for (let i=0;i<segs.length-1;i++){
    const k = segs[i];
    if (typeof node[k] !== 'object' || node[k] === null) node[k] = {};
    node = node[k];
  }
  const leaf = segs[segs.length-1];
  if (value === null || value === undefined) delete node[leaf];
  else node[leaf] = value;
}

function op(path, value){
  applyPath(path, value);
  // coalesce: this op supersedes pending ops at the same path or beneath it
  pend = pend.filter(o => o.path !== path && !o.path.startsWith(path ? path+'/' : ''));
  pend.push({ id: uid(), path, value: value === undefined ? null : value });
  LS.set('pend', pend); LS.set('cache', S);
  scheduleFlush();
  requestRender();
}

let flushing = false, flushBackoff = 2000, flushTimer = null;
function scheduleFlush(delay){
  if (!dbConfigured()){ ui.sync = 'rm'; return; }
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flushLoop, delay || 30);
}
async function flushLoop(){
  if (flushing || !dbConfigured()) return;
  flushing = true;
  while (pend.length){
    updatePill('sy');
    const o = pend[0];
    try {
      const ctl = new AbortController();
      const tt = setTimeout(()=>ctl.abort(), 15000);
      const res = await fetch(pathUrl(o.path), { method:'PUT', body: JSON.stringify(o.value), headers:{'Content-Type':'application/json'}, signal: ctl.signal });
      clearTimeout(tt);
      if (!res.ok) throw new Error('HTTP '+res.status);
      // dequeue only if the op we actually sent is still at the head — op()
      // may have coalesced/replaced it during the await
      if (pend[0] && pend[0].id === o.id){ pend.shift(); LS.set('pend', pend); }
      flushBackoff = 2000;
    } catch(e) {
      flushing = false;
      updatePill('q');
      scheduleFlush(flushBackoff);
      flushBackoff = Math.min(flushBackoff*2, 30000);
      return;
    }
  }
  flushing = false;
  updatePill(sse.ok ? 'live' : (dbConfigured() ? 'rc' : 'rm'));
}
function updatePill(state){
  if (!dbConfigured()) state = 'rm';
  else if (pend.length && state !== 'sy') state = 'q';
  ui.sync = state;
  document.querySelectorAll('[data-pill]').forEach(el => { el.outerHTML = pillHtml(); });
}

const sse = { es:null, ok:false, errs:0, poll:null, snapped:false };
function sseConnect(){
  if (!dbConfigured() || sse.es) return;
  sse.errs = 0;
  try {
    const es = new EventSource(pathUrl(''));
    sse.es = es;
    es.addEventListener('put', ev => { sse.ok = true; sse.errs = 0; sse.snapped = true; remoteEvent('put', JSON.parse(ev.data)); });
    es.addEventListener('patch', ev => { remoteEvent('patch', JSON.parse(ev.data)); });
    es.addEventListener('keep-alive', ()=>{ sse.ok = true; });
    es.onerror = () => {
      sse.ok = false; sse.errs++;
      updatePill('rc');
      if (sse.errs >= 3){ try{ es.close(); }catch(e){} sse.es = null; startPoll(); }
    };
    es.onopen = () => { sse.ok = true; sse.errs = 0; stopPoll(); updatePill(pend.length?'q':'live'); };
  } catch(e){ startPoll(); }
}
function startPoll(){
  if (sse.poll) return;
  sse.poll = setInterval(async () => {
    if (document.hidden || !dbConfigured()) return;
    try {
      const res = await fetch(pathUrl(''));
      if (res.ok){ sse.snapped = true; remoteEvent('put', { path:'/', data: await res.json() }); }
    } catch(e){}
  }, 15000);
}
function stopPoll(){ clearInterval(sse.poll); sse.poll = null; }

function getAtPath(path){
  if (!path) return S;
  let node = S;
  for (const k of path.split('/')){
    if (node == null || typeof node !== 'object') return undefined;
    node = node[k];
  }
  return node;
}
function remoteEvent(kind, ev){
  const before = snapshotForDiff();
  const p = (ev.path||'/').replace(/^\//,'');
  const localBefore = JSON.stringify(getAtPath(p) === undefined ? null : getAtPath(p));
  const incoming = JSON.stringify(ev.data === undefined ? null : ev.data);
  if (kind === 'put') applyPath(p, ev.data);
  else if (ev.data && typeof ev.data === 'object') for (const [k,v] of Object.entries(ev.data)) applyPath(p ? p+'/'+k : k, v);
  // local pending edits win until flushed
  for (const o of pend) applyPath(o.path, o.value);
  LS.set('cache', S);
  ui.remoteTick = Date.now();
  afterRemote(before, p, localBefore !== incoming, incoming);
  requestRender();
}
function snapshotForDiff(){
  const finals = {};
  for (const m of allMatches()){ const dr = mDer(m); if (dr.st.done) finals[m.id] = dr.st.result.text; }
  const c = cup();
  return { finals, red: c.red, blue: c.blue };
}
function afterRemote(before, evPath, changed, incoming){
  const after = snapshotForDiff();
  for (const [id, txt] of Object.entries(after.finals)){
    if (before.finals[id] !== txt && ui.seenFinals[id] !== txt){
      ui.seenFinals[id] = txt;
      const mm = theMatch(id);
      if (!mm || !mm.side){ pointPost(); maybeClinch(); } // grudge finals don't flash the cup
    }
  }
  // conflict toast only for a GENUINE conflict: the remote value differs from
  // what this phone had AND this phone has its own unsent edit at that path
  // (self-echoes and identical writes stay silent)
  const mId = ui.matchId;
  if (changed && ui.screen === 'match' && mId && evPath.startsWith('matches/'+mId+'/holes/')){
    const hn = evPath.split('/')[3];
    const ours = pend.some(o => (o.path === evPath || o.path.startsWith(evPath+'/')) && JSON.stringify(o.value) !== incoming);
    if (ours && String(ui.hole[mId]) === String(hn)) toastSnack(`Another phone also scored ${hn} — showing latest`);
  }
}
function pointPost(){
  try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
  ui.flashCup = true; // applied in postRender so the full re-render can't wipe it
  requestRender();
}

function renderBoard(d){

    if (!gm.length) body += `<div class="empty" style="padding:10px">No matches in this wave yet.</div>`;
  }

    body += `<div class="tgh">🥊 GRUDGE MATCHES — bragging rights only</div>`;

    body = `<div class="empty">Carts are loaded. Make the matches.<br>

  }

  const out = named.filter(p=>!isPresent(d,p.id));

  if (out.length && named.length)
    foot = `<button class="dayfoot" data-act="setup" data-d="${d}">${named.length-out.length} of ${named.length} playing — ${out.map(pName).join(', ')} ${out.length>1?'are':'is'} out</button>`;
  const rm = !dbConfigured() ? `<div class="banner">Range mode — nothing’s saving to the group. Add the trip link in Settings to go live.</div>` : '';
  const est = (dc.course==='breck' && dc.rot==='be') ? `<div class="banner">Bear→Elk has no printed card — net strokes use a derived allocation.</div>` : '';
  return `
  <div class="appbar"><span class="wordmark sc">NO GIMMES</span><span class="sp"></span>${pillHtml()}${avatarHtml()}
    <button class="gear" data-act="hub" aria-label="Setup">⚙︎</button></div>

  <button class="dayctx" data-act="setup" data-d="${d}"><div class="c1">${ctx1}</div><div class="c2">${dayRulesTxt(d)}</div></button>

  ${foot}`;

function railHtml(m, d){

    if (si.kind==='side'){ dh = teamDot('A',dots.A)+teamDot('B',dots.B); }
    else { for (const [pid,n] of Object.entries(dots.players)){ const t = sideIds(m,'A').includes(pid)?'A':'B'; dh += teamDot(t,n); } }
    let fill = '', sg = '';
    if (hd && effStrokes(m, h.no)) sg = `<span class="sg">⛳</span>`;

function nextUnscored(m, after){

// ---- lo-fi hole map + stroke traces ----------------------------------------
// Breckenridge's 27 holes are keyed by nine, because a round there plays two
// of the three; every other course is a flat 1-18.
function holeMapFor(d, n){
  const dc = dayCfg(d), src = HOLEMAPS[dc.course];
  if (!src) return null;
  if (dc.course !== 'breck') return src[n] || null;
  const nine = (holesFor(d)[n-1] || {}).nine;
  return nine ? (src[nine.toLowerCase()] || {})[((n-1)%9)+1] || null : null;
}
function keyShort(m, key){ return (key==='A'||key==='B') ? teamName(key) : esc((player(key).name||'??').split(' ')[0]); }
function holeMapHtml(m, d, n){
  const dc = dayCfg(d);
  const hm = holeMapFor(d, n);
  const keys = traceKeys(m, n);
  const sel = selKey(m, n);
  // golfer chips — who the map taps and tally buttons score for. Defaults to
  // the phone's owner when they're in this match; resets every hole.
  const chipFor = (key) => {
    const cls = keySide(m, key)==='A' ? 'r' : 'b';
    const label = (key==='A'||key==='B') ? sideIds(m,key).map(pid=>player(pid).emoji).join('')+' '+teamName(key) : pName(key);
    const ti = traceInfo(traceFor(m, n, key));
    const ct = ti.started ? `<span class="ct">${ti.complete ? ti.n : ti.n+'…'}</span>` : '';
    return `<button class="gchip ${cls} ${sel===key?'sel':''}" data-act="sel" data-id="${m.id}" data-n="${n}" data-k="${esc(key)}">${label}${ct}</button>`;
  };
  const chips = keys.length ? `<div class="gchips">${keys.map(chipFor).join('')}</div>` : '';

  let bar = '';
  if (sel){
    const ti = traceInfo(traceFor(m, n, sel));
    const B = (act, label, cls='') => `<button class="tbtn ${cls}" data-act="${act}" data-id="${m.id}" data-n="${n}" data-k="${esc(sel)}">${label}</button>`;

    if (ti.pen) extra.push(`${ti.pen} penalty`);
    if (extra.length) ro += ` <span class="mut">· ${extra.join(' · ')}</span>`;
    const btns = [];
    if (!ti.complete){
      btns.push(B('tally', '+1 SHOT'));
      btns.push(B('pen', 'PENALTY', 'lite'));
      if (!hm) btns.push(B('holed', '⛳ IN THE HOLE', 'go'));
    }
    if (ti.started) btns.push(B('traceundo', '↶', 'undo'));
    const clr = ti.started ? `<button class="clr" data-act="traceclear" data-id="${m.id}" data-n="${n}" data-k="${esc(sel)}">clear</button>` : '';
    bar = `<div class="tracebar"><div class="rorow"><span class="ro">${ro}</span>${clr}</div><div class="tbtns">${btns.join('')}</div></div>`;
  }

  if (last){
    const [px, py] = last.replace('M','').split(' ').map(Number);
    if (isFinite(px) && isFinite(py)){
      fx = px; fy = py;
      flag = `<g transform="translate(${fx} ${fy})"><line y2="-10" stroke="var(--ink)" stroke-width="1.3"/><path d="M0 -10l6.5 2.4-6.5 2.4z" fill="var(--red)"/><circle r="1.7" fill="var(--ink)"/></g>`;
    }

    if (key!=='A' && key!=='B' && !isPresent(d, key)) continue;
    const cls = keySide(m, key)==='A' ? 'r' : 'b';

    const pts = [];
    traceFor(m, n, key).forEach((st, i)=>{
      if (st.h && fx != null) pts.push({ st, i, px:fx, py:fy });
      else if (st.x != null && st.y != null) pts.push({ st, i, px:st.x*w, py:st.y*hh });
    });
    if (!pts.length) continue;
    const at = q => `transform="translate(${q.px.toFixed(1)} ${q.py.toFixed(1)})"`;
    if (key === sel){
      if (pts.length > 1) dots += `<polyline class="tr ${cls}" points="${pts.map(q=>q.px.toFixed(1)+','+q.py.toFixed(1)).join(' ')}"/>`;
      for (const q of pts)
        dots += q.st.h ? `<g class="bmark hole" ${at(q)}><circle r="6"/></g>`
                       : `<g class="bmark sel ${cls}" ${at(q)}><circle r="8"/><text>${q.i+1}</text></g>`;

  let inbtn = '';
  if (tappable && fx != null){
    const bw = 44, bh = 20, gap = 5;
    const below = fy < hh/2;
    const bx = Math.min(w - bw - 3, Math.max(3, fx - bw/2));
    const by = below ? Math.min(hh - bh - 3, fy + PIN_R + gap) : Math.max(3, fy - PIN_R - gap - bh);

      <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6"/><text x="${bx+bw/2}" y="${by+bh/2+0.5}">⛳ IN</text></g>`;
  }

  return `${chips}${lead}<div class="hmap"><svg viewBox="0 0 ${w} ${hh}" preserveAspectRatio="xMidYMid meet" ${tapAttrs}>${shapes}${pin}${dots}${flag}${inbtn}</svg>
    ${hint ? `<div class="mhint">${hint}</div>` : ''}</div>${bar}`;
}
// ---- historical hole notes (shared, keyed to the physical hole) ------------

function ledgerHtml(m, d){
  const hs = holesFor(d);
  const dc = dayCfg(m.day);
  let rows = '';
  for (const h of hs){
    const hd = (m.holes||{})[h.no];
    const strokes = effStrokes(m, h.no);
    if (!hd || (!hd.winner && !strokes)) continue;
    const w = hd.winner;
    let res = w==='A'?teamName('A'):w==='B'?teamName('B'):w==='H'?'HALVED':'—';
    let notes = [];
    if (overridden(m, h.no)) notes.push(`set by hand — strokes say ${teamName(derivedWinner(m,h.no))}`);
    if (drifted(m, h.no)) notes.push(`strokes now say ${teamName(derivedWinner(m,h.no))} — scored before a settings change`);
    if (hd.exhibition) notes.push('for fun');
    if (m.concededAt === h.no) notes.push(`Conceded by ${teamName(m.concededBy)} on ${h.no}`);
    let sk = '';
    if (strokes){
      sk = Object.entries(strokes).map(([k,v])=>{
        const label = (k==='A'||k==='B') ? teamName(k) : player(k).emoji;
        return `${label} ${v==='pickup'?'—':v}`;
      }).join(' · ');
      // a posted score never overwrites the trace — where they disagree, say so
      for (const k of traceKeys(m, h.no)){
        const hand = (hd.strokes||{})[k], ti = traceInfo(traceFor(m, h.no, k));
        if (hand != null && ti.complete && ti.n !== hand)
          notes.push(`${(k==='A'||k==='B') ? teamName(k) : player(k).emoji} posted ${hand==='pickup'?'—':hand}, mapped ${ti.n}`);
      }
    }
    const jd = Object.entries(S.junk||{}).filter(([,j])=>j && j.day===m.day && j.hole===h.no && [...sideIds(m,'A'),...sideIds(m,'B')].includes(j.pid))
      .map(([,j])=>`${player(j.pid).emoji} ${JUNKTYPES[j.type]||j.type}`).join(' · ');
    rows += `<tr><td class="num">${h.no}</td><td class="num">${h.par}</td><td class="num">${h.si}</td>
      <td><span class="wtag ${w||''}">${res}</span></td><td class="n">${sk}</td>
      <td class="n">${[notes.join(' · '), jd].filter(Boolean).join(' · ')}</td></tr>`;
  }
  if (!rows) return '';
  return `<div class="ledger"><table><tr><th>Hole</th><th>Par</th><th>SI</th><th>Result</th><th>Strokes</th><th>Notes</th></tr>${rows}</table></div>`;
}

function skinsSummary(){
  const conf = cfg();
  const won = {}; let carried = 0;
  for (const d of DAYS){
    const ms = matchesFor(d);
    if (!ms.length) continue;
    let carry = 0;
    for (let n=1;n<=18;n++){
      const entries = [];
      const seenPid = new Set();
      for (const m of ms){
        const strokes = effStrokes(m, n);
        if (!strokes) continue;
        const si = mStrokes(m, mFormat(m, n));
        const hcell = holesFor(d)[n-1];
        for (const [k,v] of Object.entries(strokes)){
          if (v==='pickup'||v==null||k==='A'||k==='B') continue;
          if (seenPid.has(k)) continue; seenPid.add(k);
          const dots = conf.skinsNet ? ENG.dotsOnHole(si.players[k]||0, hcell.si, 18) : 0;
          entries.push({ pid:k, net:v-dots });
        }
      }
      if (!entries.length) continue;
      entries.sort((a,b)=>a.net-b.net);
      if (entries.length===1 || entries[0].net < entries[1].net){
        won[entries[0].pid] = (won[entries[0].pid]||0) + 1 + (conf.skinsCarry?carry:0); carry = 0;
      } else if (conf.skinsCarry) carry++;
    }
    carried += carry;
  }
  const l = Object.entries(won).sort((a,b)=>b[1]-a[1]).map(([pid,n])=>`${player(pid).emoji} ${n}`).join(' · ');
  return l ? l + (carried?` · ${carried} carried`:'') : '<span class="mut">Needs stroke entry — nothing derivable yet.</span>';
}

const $app = document.getElementById('app');
const $sheetlayer = document.getElementById('sheetlayer');
const $sheetbox = document.getElementById('sheetbox');
const $snack = document.getElementById('snack');
const $takeover = document.getElementById('takeover');

let raf = 0, renderDeferred = false;
function inputFocused(){
  const a = document.activeElement;
  return a && (a.tagName==='INPUT' || a.tagName==='SELECT' || a.tagName==='TEXTAREA');
}
function requestRender(){
  if (raf) return;
  raf = requestAnimationFrame(()=>{ raf = 0;
    if (inputFocused()){ renderDeferred = true; return; }
    render();
  });
}
document.addEventListener('focusout', ()=>{ if (renderDeferred){ renderDeferred=false; setTimeout(requestRender, 60); } });

let bootT = Date.now(), connT = null;
function render(){
  let html;
  try { html = renderScreen(); }
  catch(e){ console.error(e); html = `<div class="empty" style="padding-top:80px">Something choked on the data.<br>
    <span class="mut" style="font-size:12px">${esc(String(e && e.message || e))}</span><br>
    <button class="cta" data-act="board">Back to the board</button></div>`; }
  const rw0 = document.getElementById('railwrap');
  ui.railScroll = rw0 ? rw0.scrollLeft : null;
  $app.innerHTML = html;
  // keep an open sheet's content live (points land while the Cup Sheet is up)
  if (ui.sheet && ui.sheet.type !== 'confirmtext' && !inputFocused()){
    try { $sheetbox.innerHTML = sheetHtml(ui.sheet); } catch(e){}
  }
  try { postRender(); } catch(e){ console.error(e); }
}
function renderScreen(){
  const seeded = Object.keys(S.players||{}).length > 0;
  if (!seeded){
    // a joining phone must never see the kickoff just because the first sync
    // hasn't landed yet — wait for the snapshot (or 6s) before offering it
    if (dbConfigured() && !sse.snapped && Date.now() - bootT < 6000){
      clearTimeout(connT); connT = setTimeout(requestRender, 1200);
      return renderConnecting();
    }
    return renderKickoff();
  }
  const me = LS.get('id', null);
  if (me && me !== 'watch' && !(S.players||{})[me]) LS.del('id'); // deleted identity → re-ask
  const me2 = LS.get('id', null);
  if ((!me2 && rosterReady() && ui.screen !== 'settings' && ui.screen !== 'setup') || ui.screen === 'who') return renderWho();
  if (ui.screen === 'match' && ui.matchId) return renderMatch(ui.matchId);
  if (ui.screen === 'setup' && ui.day) return renderSetupDay(ui.day);
  if (ui.screen === 'settings') return renderSettings();
  return renderBoard(ui.day || resolveDay());
}
function postRender(){
  if (ui.flashCup){
    ui.flashCup = false;
    document.querySelectorAll('.tug .aR,.tug .aB').forEach(el=>el.classList.add('flash'));
    document.querySelectorAll('.cupline .pts,.cupstrip .mini').forEach(el=>el.classList.add('ticked'));
  }
  if (ui.screen === 'match' && ui.matchId){
    const m = theMatch(ui.matchId);
    if (m){
      const key = ui.matchId + ':' + curHole(m);
      const rw = document.getElementById('railwrap');
      if (ui.railKey !== key){
        ui.railKey = key;
        const cell = document.getElementById('cell'+curHole(m));
        if (cell) cell.scrollIntoView({ block:'nearest', inline:'center', behavior:'auto' });
      } else if (rw && ui.railScroll != null){
        rw.scrollLeft = ui.railScroll; // re-render rebuilt the rail — put it back where it was
      }
    }
  }
}

// ---- navigation ------------------------------------------------------------
function navigate(hash){ if (location.hash === hash) { parseRoute(); requestRender(); } else location.hash = hash; }
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  closeSheet(true);
  if (parts[0]==='who'){ ui.screen='who'; return; }
  if (parts[0]==='match' && parts[1] && theMatch(parts[1])){
    ui.screen='match'; ui.matchId = parts[1]; ui.day = theMatch(parts[1]).day; LS.set('day', ui.day); return;
  }
  if (parts[0]==='day' && DAYS.includes(parts[1])){
    ui.day = parts[1]; LS.set('day', ui.day);
    ui.screen = parts[2]==='setup' ? 'setup' : 'board'; return;
  }
  if (parts[0]==='settings'){ ui.screen='settings'; return; }
  ui.screen='board'; ui.day = ui.day || resolveDay();
}
window.addEventListener('hashchange', ()=>{ parseRoute(); requestRender(); });

}
