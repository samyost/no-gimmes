    const pct = dc.allowancePct != null ? dc.allowancePct : (dayAllowancePct(d) != null ? dayAllowancePct(d) : 100);
    return `<h3>Today’s allowance</h3>
      <div style="display:flex;align-items:center;gap:10px"><span>Percent of handicap</span><span style="flex:1"></span>
        <div class="stepper"><button data-act="allowpct" data-d="${d}" data-v="-5">−</button><span class="v sc">${pct}%</span><button data-act="allowpct" data-d="${d}" data-v="5">+</button></div></div>
      <div class="mut" style="font-size:13px;margin-top:8px">Strokes always play off the low man of the match, falling on the card’s stroke-index holes. WHS presets live in Trip &amp; rules.</div>
      <div class="btnrow"><button class="bigbtn ghost" data-act="allowreset" data-d="${d}">Use the WHS preset</button></div>`;
  }
  if (t==='oddman'){
    const names = sh.left.map(pName).join(' + ');
    return `<h3>${sh.left.length===3?'Three left over':'Odd numbers'}</h3>
      <div style="font-size:14.5px">${names} don’t pair evenly.</div>
      <div class="btnrow" style="flex-direction:column">
        ${sh.canA?`<button class="bigbtn pri" data-act="odd-a" data-d="${sh.d}">Two-on-one — ${esc(sh.aLabel||'hero or martyr')}</button>`:''}
        <button class="bigbtn ghost" data-act="odd-b" data-d="${sh.d}">Odd man rides — junk &amp; skins only</button>
      </div>`;
  }
  if (t==='confirmtext'){
    return `<h3>${esc(sh.title)}</h3><div>${esc(sh.body)} <b>Type the trip name. No mulligans on this one.</b></div>
      <input type="text" class="wide" id="confirmfield" style="width:100%;margin-top:10px;background:var(--bone);border:1px solid var(--pencil);border-radius:8px;padding:10px" placeholder="${esc(cfg().tripName)}">
      <div class="btnrow"><button class="bigbtn ghost" data-act="sheet-close">Never mind</button>
      <button class="bigbtn danger" data-act="${sh.act}">Do it</button></div>`;
  }
  return '';
}

// ---- snackbar / takeover ---------------------------------------------------
function snack(text, btn, fn){
  clearTimeout(ui.snackT);
  ui.undoFn = fn || null;
  const pad = document.querySelector('.pad');
  $snack.style.bottom = pad ? Math.max(12, Math.round(innerHeight - pad.getBoundingClientRect().top) + 8) + 'px'
                            : 'calc(20px + env(safe-area-inset-bottom))';
  $snack.innerHTML = `<div class="snackin"><span>${text}</span>${btn?`<button data-act="snackbtn">${btn}</button>`:''}</div>`;
  ui.snackT = setTimeout(()=>{ $snack.innerHTML=''; ui.undoFn=null; }, 6000);
}
function toastSnack(text){ snack(esc(text)); }
function showTakeover(cls, big, sub){
  $takeover.className = 'open ' + cls;
  $takeover.innerHTML = `<div><div class="big sc">${big}</div><div class="sub">${sub||''}</div>
    <button class="cont sc" data-act="takeover-close">CONTINUE</button></div>`;
}
function maybeClinch(){
  const c = cup();
  if (c.scheduled < 1) return;
  let side = null;
  if (c.red >= c.win) side = 'A'; else if (c.blue >= c.win) side = 'B';
  if (side){
    const key = 'clinch_'+side+'_'+c.win;
    if (LS.get(key, false)) return; LS.set(key, true);
    showTakeover(side==='A'?'red':'blue', `THAT’S THE CUP. ${teamName(side)} ${halfTxt(side==='A'?c.red:c.blue)}.`, 'Somebody pour something.');
    return;
  }
  if (c.holder && c.retain != null){
    const hPts = c.holder==='red'?c.red:c.blue;
    const oPts = c.holder==='red'?c.blue:c.red;
    const oMax = oPts + (c.scheduled - c.red - c.blue);
    if (hPts >= c.retain && oMax < c.win){
      const key = 'retain_'+c.retain;
      if (LS.get(key, false)) return; LS.set(key, true);
      showTakeover(c.holder==='red'?'red':'blue', `${teamName(c.holder==='red'?'A':'B')} KEEP THE CUP.`, `${halfTxt(hPts)}–${halfTxt(oPts)} — holders retain. That was the deal.`);
    }
  }
}

// ---- scoring actions -------------------------------------------------------
function commitHole(mid, n, w, viaExplicit){
  const m = theMatch(mid); if (!m || ui.lock) return;
  const before = mDer(m);
  const prev = (m.holes||{})[n] ? JSON.parse(JSON.stringify(m.holes[n])) : null;
  const drawerOpen = LS.get('drawer_'+mid, false);
  const via = viaExplicit || ((drawerOpen && litSide(m,n)===w) ? 'strokes' : 'tap');
  const willExh = !!(before.st.done && n > (before.st.decidedAt || 0));
  // same-result tap offers CLEAR — unless it would change the hole's
  // exhibition status (re-tapping a for-fun hole after a reopen makes it real)
  if (prev && prev.winner === w && !!prev.exhibition === willExh){
    snack(`Hole ${n} again?`, 'CLEAR HOLE', ()=>{ clearHole(mid, n); });
    return;
  }
  // narrow per-field writes so a concurrent stroke entry on the same hole
  // from another phone is never clobbered by a whole-hole PUT
  op(`matches/${mid}/holes/${n}/winner`, w);
  op(`matches/${mid}/holes/${n}/via`, via);
  op(`matches/${mid}/holes/${n}/exhibition`, willExh ? true : null);
  op(`matches/${mid}/touched`, Date.now());
  const after = mDer(theMatch(mid));
  ui.lock = true;
  setTimeout(()=>{ ui.lock = false; requestRender(); }, 700);
  const editing = !!(prev && prev.winner);
  if (!before.st.done && after.st.done){
    ui.seenFinals[mid] = after.st.result.text;
    if (!m.side) pointPost();
    setTimeout(()=>{ openSheet('closure', { mid }); if (!m.side) maybeClinch(); }, 300);
  } else if (before.st.done && !after.st.done){
    const wteam = before.st.result.winner;
    snack(`Match reopened — ${wteam?teamName(wteam)+'’s point came off the board':'the half came off the board'}`, 'UNDO',
      ()=>{ op(`matches/${mid}/holes/${n}`, prev); requestRender(); });
  } else {
    const label = w==='A'?teamName('A'):w==='B'?teamName('B'):'HALVED';
    const txt = editing ? `Hole ${n} changed: now ${label}` : `Hole ${n}: ${label}`;
    snack(txt, 'UNDO', ()=>{ op(`matches/${mid}/holes/${n}`, prev); ui.hole[mid]=n; requestRender(); });
    if (!before.st.dormie && after.st.dormie && !LS.get('dormie_'+mid, false)){
      LS.set('dormie_'+mid, true);
      const trailing = after.st.leader==='A' ? teamName('B') : teamName('A');
      setTimeout(()=>toastSnack(`DORMIE. ${trailing} can’t win it — only save the half.`), 900);
    }
  }
  if (editing){ ui.hole[mid] = null; }
  else if (!after.st.done){
    const nx = nextUnscored(theMatch(mid), n);
    setTimeout(()=>{ ui.hole[mid] = nx; requestRender(); }, 250);
  }
  requestRender();
}
function clearHole(mid, n){
  const m = theMatch(mid); if (!m) return;
  const before = mDer(m);
  const prev = (m.holes||{})[n] ? JSON.parse(JSON.stringify(m.holes[n])) : null;
  const keep = {};
  if (prev && prev.strokes) keep.strokes = prev.strokes;
  if (prev && prev.trace) keep.trace = prev.trace;
  op(`matches/${mid}/holes/${n}`, Object.keys(keep).length ? keep : null);
  op(`matches/${mid}/touched`, Date.now());
  const after = mDer(theMatch(mid));
  if (before.st.done && !after.st.done){
    const wteam = before.st.result.winner;
    snack(`Match reopened — ${wteam ? teamName(wteam)+'’s point came off the board' : 'the half came off the board'}`, 'UNDO',
      ()=>{ op(`matches/${mid}/holes/${n}`, prev); requestRender(); });
  } else {
    snack(`Hole ${n} cleared`, 'UNDO', ()=>{ op(`matches/${mid}/holes/${n}`, prev); requestRender(); });
  }
  ui.hole[mid] = n;
  requestRender();
}
function setGross(mid, n, k, v){
  const m = theMatch(mid); if (!m) return;
  const cur = (((m.holes||{})[n]||{}).strokes||{})[k];
  const clear = cur === v || v < 1 || v > 15;
  op(`matches/${mid}/holes/${n}/strokes/${k}`, clear ? null : v);
}

// ---- setup actions ---------------------------------------------------------
function makeMatches(d){
  const dc = dayCfg(d);
  const ms = cupMatchesFor(d);
  const scored = ms.filter(m=>Object.values(m.holes||{}).some(h=>h&&h.winner));
  for (const m of ms) if (!scored.includes(m)) op('matches/'+m.id, null);
  const usedPids = new Set(scored.flatMap(m=>[...sideIds(m,'A'),...sideIds(m,'B')]));
  const leftovers = [];
  let ord = scored.length;
  for (const g of ['a','b']){
    const carts = Object.entries(dc.carts).filter(([,c])=>c && (c.group||'a')===g && arr(c.seats).filter(Boolean).length);
    const gPids = carts.flatMap(([,c])=>arr(c.seats).filter(Boolean)).filter(pid=>isPresent(d,pid) && !usedPids.has(pid));
    if (!gPids.length) continue;
    if (dc.format === 'singles'){
      const reds = gPids.filter(pid=>effTeam(d,pid)==='red');
      const blues = gPids.filter(pid=>effTeam(d,pid)==='blue');
      const k = Math.min(reds.length, blues.length);
      for (let i=0;i<k;i++)
        op('matches/m'+uid(), { day:d, group:g, ord:ord++, red:[reds[i]], blue:[blues[i]], holes:{} });
      leftovers.push(...reds.slice(k), ...blues.slice(k));
    } else {
      // cart vs cart when carts are single-team
      const pure = carts.filter(([,c])=>{
        const seats = arr(c.seats).filter(pid=>pid && isPresent(d,pid) && !usedPids.has(pid));
        if (!seats.length) return false;
        const ts = new Set(seats.map(pid=>effTeam(d,pid)));
        return ts.size===1 && !ts.has(null);
      });
      const redCarts = pure.filter(([,c])=>effTeam(d,arr(c.seats).filter(Boolean)[0])==='red');
      const blueCarts = pure.filter(([,c])=>effTeam(d,arr(c.seats).filter(Boolean)[0])==='blue');
      const k = Math.min(redCarts.length, blueCarts.length);
      const paired = new Set();
      for (let i=0;i<k;i++){
        const rs = arr(redCarts[i][1].seats).filter(pid=>pid&&isPresent(d,pid)&&!usedPids.has(pid));
        const bs = arr(blueCarts[i][1].seats).filter(pid=>pid&&isPresent(d,pid)&&!usedPids.has(pid));
        rs.forEach(p=>paired.add(p)); bs.forEach(p=>paired.add(p));
        op('matches/m'+uid(), { day:d, group:g, ord:ord++, red:rs.slice(0,2), blue:bs.slice(0,2), holes:{} });
      }
      leftovers.push(...gPids.filter(pid=>!paired.has(pid)));
    }
  }
  if (leftovers.length){
    const reds = leftovers.filter(pid=>effTeam(d,pid)==='red');
    const blues = leftovers.filter(pid=>effTeam(d,pid)==='blue');
    if (reds.length && blues.length){
      const solo = reds.length===1 && blues.length>1 ? reds[0] : blues.length===1 && reds.length>1 ? blues[0] : null;
      openSheet('oddman', { d, left:leftovers, canA:true,
        aLabel: solo ? `${esc((player(solo).name||'').split(' ')[0])} against two balls. Hero or martyr.`
                     : (reds.length===1 && blues.length===1 ? `${pName(reds[0])} vs ${pName(blues[0])} — make it a match` : 'pair them up') });
      return;
    }
    if (leftovers.length){
      openSheet('oddman', { d, left:leftovers, canA:false, aLabel:'' });
      return;
    }
  }
  toastSnack('Matches made. Argue amongst yourselves.');
}
function ridePartner(d){
  const dc = dayCfg(d);
  const reds = presentIds(d).filter(pid=>effTeam(d,pid)==='red');
  const blues = presentIds(d).filter(pid=>effTeam(d,pid)==='blue');
  const others = presentIds(d).filter(pid=>!effTeam(d,pid));
  const pairs = [];
  for (let i=0;i<reds.length;i+=2) pairs.push(reds.slice(i,i+2));
  for (let i=0;i<blues.length;i+=2) pairs.push(blues.slice(i,i+2));
  for (let i=0;i<others.length;i+=2) pairs.push(others.slice(i,i+2));
  // interleave red/blue pairs so each wave gets one of each
  pairs.sort((a,b)=>0);
  const ordered = [];
  const rp = pairs.filter(p=>effTeam(d,p[0])==='red'), bp = pairs.filter(p=>effTeam(d,p[0])==='blue'), op2 = pairs.filter(p=>!effTeam(d,p[0]));
  while (rp.length||bp.length||op2.length){
    if (rp.length) ordered.push(rp.shift());
    if (bp.length) ordered.push(bp.shift());
    if (!rp.length && !bp.length && op2.length) ordered.push(op2.shift());
  }
  ordered.slice(0,4).forEach((seats,i)=>{
    op(`days/${d}/carts/c${i+1}`, { seats, group: i<2 ? 'a':'b' });
  });
  for (let i=ordered.length;i<4;i++) op(`days/${d}/carts/c${i+1}`, null);
}
function mixItUp(d){
  const reds = presentIds(d).filter(pid=>effTeam(d,pid)==='red');
  const blues = presentIds(d).filter(pid=>effTeam(d,pid)==='blue');
  const others = presentIds(d).filter(pid=>!effTeam(d,pid));
  const carts = [];
  const n = Math.max(reds.length, blues.length);
  for (let i=0;i<n;i++){
    const seats = [reds[i], blues[i]].filter(Boolean);
    if (seats.length) carts.push(seats);
  }
  for (let i=0;i<others.length;i+=2) carts.push(others.slice(i,i+2));
  carts.slice(0,4).forEach((seats,i)=> op(`days/${d}/carts/c${i+1}`, { seats, group: i<2?'a':'b' }));
  for (let i=carts.length;i<4;i++) op(`days/${d}/carts/c${i+1}`, null);
}

// ---- delegated events ------------------------------------------------------
// SVG controls carry role=button + tabindex; Enter/Space activates them like a real button
document.addEventListener('keydown', (ev)=>{
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const el = ev.target.closest && ev.target.closest('svg [data-act][tabindex]');
  if (el){ ev.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
});
document.addEventListener('click', (ev)=>{
  const mt = ev.target.closest('[data-maptap]');
  if (mt && !ev.target.closest('[data-act]')){
    const m = theMatch(mt.dataset.id), n = +mt.dataset.n;
    const key = m && selKey(m, n);
    if (key){
      const r = mt.getBoundingClientRect();
      let x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
      let y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
      // every tap is where that shot finished. On or beside the flag it snaps
      // to the pin — a putt that stayed out. Holing is the IN button by the flag.
      const fx = mt.dataset.fx, fy = mt.dataset.fy, w = +mt.dataset.w, h = +mt.dataset.h;
      if (fx !== '' && fx != null && Math.hypot(x*w - fx, y*h - fy) <= PIN_R){ x = fx/w; y = fy/h; }
      addStroke(m, n, key, { x:+x.toFixed(3), y:+y.toFixed(3) });
    }
    return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) {
    if (!ev.target.closest('.seat,.pchip,.mslot')) { if (ui.pick){ ui.pick=null; requestRender(); } }
    return;
  }
  const a = el.dataset;
  const act = a.act;
  const clearPick = !['seat','bench','slot'].includes(act);
  if (clearPick && ui.pick){ ui.pick = null; }
  switch(act){
    // navigation
    case 'day': closeSheet(true); navigate('#/day/'+a.d); break;
    case 'board': closeSheet(true); navigate('#/day/'+(ui.day||resolveDay())); break;
    case 'match': closeSheet(true); navigate('#/match/'+a.id); break;
    case 'setup': closeSheet(true); navigate('#/day/'+(a.d||ui.day||resolveDay())+'/setup'); break;
    case 'settings': closeSheet(true); navigate('#/settings'); break;
    case 'hub': openSheet('hub'); break;
    case 'days': openSheet('days'); break;
    case 'cupsheet': openSheet('cup'); break;
    case 'gloss': openSheet('gloss'); break;
    case 'pill': openSheet('pill'); break;
    case 'badge21': openSheet('badge21'); break;
    case 'sheet-close': closeSheet(); break;
    case 'takeover-close': $takeover.className=''; $takeover.innerHTML=''; break;
    case 'snackbtn': { const f = ui.undoFn; ui.undoFn=null; $snack.innerHTML=''; if (f) f(); break; }
    case 'who': closeSheet(true); ui.screen='who'; requestRender(); break;
    // stroke traces — who's selected, tally, end markers, undo
    case 'sel': { const m = theMatch(a.id); if (!m) break;
      const n = +a.n; ui.sel[a.id] = { n, key: selKey(m, n)===a.k ? null : a.k }; requestRender(); break; }
    case 'tally': { const m = theMatch(a.id); if (m) addStroke(m, +a.n, a.k, { u:1 }); break; }
    case 'pen': { const m = theMatch(a.id); if (m) addStroke(m, +a.n, a.k, { p:1, u:1 }); break; }
    case 'holed': { const m = theMatch(a.id); if (m) holeOut(m, +a.n, a.k); break; }
    case 'traceundo': { const m = theMatch(a.id); if (!m) break;
      const st = ui.traceUndo[a.id+'/'+a.n+'/'+a.k];
      let list;
      if (st && st.length) list = st.pop();
      else { // no local history (reloaded phone): peel the most recent end
        list = traceFor(m, +a.n, a.k); const ti = traceInfo(list);
        if (ti.rev && ti.complete) delete list[0].t; else if (ti.rev) list.shift(); else list.pop();
      }
      setTrace(m, +a.n, a.k, list, true); break; }
    case 'traceclear': { const m = theMatch(a.id); if (!m) break;
      const prev = traceFor(m, +a.n, a.k);
      ui.traceUndo[a.id+'/'+a.n+'/'+a.k] = [];
      setTrace(m, +a.n, a.k, [], true);
      snack(`${keyShort(m, a.k)}’s strokes cleared on ${a.n}`, 'UNDO', ()=>{ const mm = theMatch(a.id); if (mm) setTrace(mm, +a.n, a.k, prev, true); });
      break; }
    case 'usemap': op(`matches/${a.id}/holes/${a.n}/strokes/${a.k}`, null); break;
    case 'noteedit': ui.noteEdit = a.c + '/' + a.hn; requestRender(); break;
    case 'iam': {
      LS.set('id', a.p); ui.screen='board';
      const h = location.hash;
      if (/^#\/(match|settings|day)/.test(h)){ parseRoute(); requestRender(); }
      else landHome(true);
      break;
    }
    case 'kickoff': (async ()=>{
      if (Object.keys(S.players||{}).length){ requestRender(); return; }
      if (dbConfigured()){
        try {
          const ctl = new AbortController(); const tt = setTimeout(()=>ctl.abort(), 8000);
          const res = await fetch(pathUrl(''), { signal: ctl.signal });
          clearTimeout(tt);
          const data = await res.json();
          if (data && typeof data === 'object' && Object.keys(data).length){
            sse.snapped = true; remoteEvent('put', { path:'/', data }); return; // trip already exists — join it
          }
        } catch(e){ toastSnack('Can’t reach the database — check signal and try again.'); return; }
      }
      op('', seedTree()); navigate('#/settings');
    })(); break;
    case 'scroll': { const t = document.getElementById(a.t); if (t) t.scrollIntoView({behavior:'smooth'}); break; }

    // scoring
    case 'win': commitHole(a.id, +a.n, a.w); break;
    case 'hole': {
      const m = theMatch(a.id); if (!m) break;
      const dr = mDer(m);
      const n = +a.n;
      const hd = (m.holes||{})[n];
      const keepOn = ui['keep_'+a.id] || Object.values(m.holes||{}).some(h=>h&&h.exhibition);
      if (dr.st.done && dr.st.decidedAt && n > dr.st.decidedAt && !keepOn && !(hd&&hd.winner)){
        openSheet('funprompt', { mid:a.id, n }); break;
      }
      ui.hole[a.id] = n; requestRender(); break;
    }
    case 'drawer': LS.set('drawer_'+a.id, !LS.get('drawer_'+a.id, false)); requestRender(); break;
    case 'gross': setGross(a.id, +a.n, a.k, +a.v); break;
    case 'pickup': {
      const m = theMatch(a.id); if (!m) break;
      const cur = (((m.holes||{})[+a.n]||{}).strokes||{})[a.k];
      op(`matches/${a.id}/holes/${a.n}/strokes/${a.k}`, cur==='pickup' ? null : 'pickup'); break;
    }
    case 'clearhole': clearHole(a.id, +a.n); break;
    case 'keepplay': ui['keep_'+a.id]=true; closeSheet(); requestRender(); break;
    case 'keepplayhole': ui['keep_'+a.mid]=true; ui.hole[a.mid]=+a.n; closeSheet(); requestRender(); break;
    case 'fixhole': toastSnack('Tap any hole above to fix it.'); break;
    case 'ovf': openSheet('ovf', { mid:a.id }); break;
    case 'strokesfall': openSheet('strokesfall', { mid:a.mid }); break;
    case 'concede1': openSheet('concede1', { mid:a.mid }); break;
    case 'concede2': openSheet('concede2', { mid:a.mid, by:a.by }); break;
    case 'concede3': {
      const m = theMatch(a.mid); if (!m) break;
      const dr = mDer(m);
      op(`matches/${a.mid}/concededBy`, a.by);
      op(`matches/${a.mid}/concededAt`, dr.st.thru || 1);
      op(`matches/${a.mid}/touched`, Date.now());
      ui.seenFinals[a.mid] = 'CONC';
      closeSheet();
      if (!m.side){ pointPost(); maybeClinch(); }
      requestRender(); break;
    }
    case 'reopen': {
      const m = theMatch(a.mid); if (!m) break;
      if (m.concededBy) openSheet('reopen-conc', { mid:a.mid });
      else openSheet('reopen-derived', { mid:a.mid });
      break;
    }
    case 'reopen2': {
      op(`matches/${a.mid}/concededBy`, null);
      op(`matches/${a.mid}/concededAt`, null);
      closeSheet();
      snack('Match reopened — the point came off the board');
      break;
    }
    case 'junk': openSheet('junk', { mid:a.id, n:+a.n, jt:a.t }); break;
    case 'junk2': {
      const has = !!((S.junk||{})[a.key]);
      op('junk/'+a.key, has ? null : { day: theMatch(a.mid).day, hole:+a.n, type:a.jt, pid:a.p });
      closeSheet(); requestRender(); break;
    }

    // day setup
    case 'att': op(`days/${a.d}/att/${a.p}`, isPresent(a.d, a.p) ? false : true); break;
    case 'flipteam': {
      const cur = effTeam(a.d, a.p);
      let next;
      if (!cur){
        const rc = presentIds(a.d).filter(pid=>effTeam(a.d,pid)==='red').length;
        const bc = presentIds(a.d).filter(pid=>effTeam(a.d,pid)==='blue').length;
        next = rc <= bc ? 'red' : 'blue';
      } else next = cur==='red' ? 'blue' : 'red';
      op(`days/${a.d}/teamOf/${a.p}`, next); break;
    }
    case 'copyteams': {
      const prev = DAYS[DAYS.indexOf(a.d)-1]; if (!prev) break;
      for (const pid of presentIds(a.d)){ const t = effTeam(prev, pid); if (t) op(`days/${a.d}/teamOf/${pid}`, t); }
      break;
    }
    case 'course': op(`days/${a.d}/course`, a.v); op(`days/${a.d}/tee`, null); break;
    case 'rot': op(`days/${a.d}/rot`, a.v); break;
    case 'tee': op(`days/${a.d}/tee`, a.v); break;
    case 'setsi': {
      const dc = dayCfg(a.d);
      const cst = Object.assign({ name:'', pars:Array(18).fill(4), sis:[] }, dc.custom||{});
      let sis = arr(cst.sis); if (sis.length < 18) sis = Array.from({length:18},(_,j)=>sis[j]||0);
      const i = +a.i;
      if (sis[i]) sis[i] = 0;
      else {
        const used = new Set(sis.filter(Boolean));
        let next = 1; while (used.has(next) && next <= 18) next++;
        if (next <= 18) sis[i] = next;
      }
      cst.sis = sis;
      op(`days/${a.d}/custom`, cst); break;
    }
    case 'resetsi': {
      const dc = dayCfg(a.d);
      const cst = Object.assign({ name:'', pars:Array(18).fill(4), sis:[] }, dc.custom||{});
      cst.sis = [];
      op(`days/${a.d}/custom`, cst); break;
    }
    case 'cyclepar': {
      const dc = dayCfg(a.d);
      const cst = Object.assign({ name:'', pars:Array(18).fill(4), sis:[] }, dc.custom||{});
      let pars = arr(cst.pars); if (pars.length < 18) pars = Array.from({length:18},(_,j)=>pars[j]||4);
      const i = +a.i;
      pars[i] = pars[i]>=5 ? 3 : (pars[i]||4)+1;
      cst.pars = pars;
      op(`days/${a.d}/custom`, cst); break;
    }
    case 'daynet': op(`days/${a.d}/net`, a.v==='1'); break;
    case 'allowsheet': openSheet('allow', { d:a.d }); break;
    case 'allowpct': {
      const d = a.d; const cur = dayCfg(d).allowancePct != null ? dayCfg(d).allowancePct : (dayAllowancePct(d)!=null?dayAllowancePct(d):100);
      op(`days/${d}/allowancePct`, Math.max(0, Math.min(200, cur + (+a.v))));
      openSheet('allow', { d }); break;
    }
    case 'allowreset': op(`days/${a.d}/allowancePct`, null); closeSheet(); break;
    case 'pts': {
      const cur = dayCfg(a.d).points || 1;
      op(`days/${a.d}/points`, Math.max(0.5, Math.min(5, cur + (+a.v)))); break;
    }
    case 'x2': op(`days/${a.d}/x2`, !dayCfg(a.d).x2); break;
    case 'fmt': {
      op(`days/${a.d}/format`, a.v); op(`days/${a.d}/allowancePct`, null);
      // a day going mixer with no rotation of its own picks up the library's first mix
      if (a.v==='mixer' && !dayMixId(dayCfg(a.d)) && !(((S.days||{})[a.d]||{}).mixer) && mixes().length)
        op(`days/${a.d}/mixId`, mixes()[0].id);
      break;
    }
    case 'mixpick': op(`days/${a.d}/mixId`, a.id); break;
    case 'mixnew': {
      const id = 'mx'+uid();
      const seed = a.d ? mixerCfg(dayCfg(a.d)) : sanitizeMix(MIXER_DEFAULT);
      op(`mixes/${id}`, Object.assign({ name:'', ord: mixes().length }, seed));
      if (a.d) op(`days/${a.d}/mixId`, id);
      openSheet('mixedit', { id }); break;
    }
    case 'mixsave': { // promote a day's own pre-library rotation into the shared library
      const id = 'mx'+uid();
      op(`mixes/${id}`, Object.assign({ name:'', ord: mixes().length }, mixerCfg(dayCfg(a.d))));
      op(`days/${a.d}/mixId`, id);
      openSheet('mixedit', { id }); break;
    }
    case 'mixeditsheet': openSheet('mixedit', { id:a.id }); break;
    case 'mixdelete': {
      const used = daysUsingMix(a.id);
      if (used.length && !window.confirm(`${used.map(d=>DAYMETA[d].name).join(' and ')} play${used.length===1?'s':''} this mix. Each day keeps a private copy of the rotation. Delete it from the library?`)) break;
      used.forEach(d=>{ op(`days/${d}/mixer`, mixerCfg(dayCfg(d))); op(`days/${d}/mixId`, null); });
      op(`mixes/${a.id}`, null);
      closeSheet(); break;
    }
    case 'mixseg': { const raw=(S.mixes||{})[a.id]; if (!raw) break; const mx = sanitizeMix(raw); mx.seg = +a.v; op(`mixes/${a.id}`, Object.assign({}, raw, mx)); break; }
    case 'mixflip': { const raw=(S.mixes||{})[a.id]; if (!raw) break; const mx = sanitizeMix(raw); mx.flip = !mx.flip; op(`mixes/${a.id}`, Object.assign({}, raw, mx)); break; }
    case 'mixadd': { const raw=(S.mixes||{})[a.id]; if (!raw) break; const mx = sanitizeMix(raw); if (mx.formats.length < 6) mx.formats.push(a.v); op(`mixes/${a.id}`, Object.assign({}, raw, mx)); break; }
    case 'mixdel': { const raw=(S.mixes||{})[a.id]; if (!raw) break; const mx = sanitizeMix(raw); if (mx.formats.length > 1) mx.formats.splice(+a.i, 1); op(`mixes/${a.id}`, Object.assign({}, raw, mx)); break; }
    case 'seat': {
      const d = a.d, ck = a.ck, sIdx = +a.s;
      const dc = dayCfg(d);
      const cart = Object.assign({ seats:[], group: +ck.slice(1)<=2?'a':'b' }, dc.carts[ck]||{});
      const seats = arr(cart.seats).slice();
      if (ui.pick && ui.pick.kind==='bench'){
        seats[sIdx] = ui.pick.pid; ui.pick=null;
        cart.seats = seats.filter(Boolean).length ? seats.map(x=>x||null).filter((x,i)=>i<3) : seats;
        op(`days/${d}/carts/${ck}`, { seats: seats.filter(Boolean), group: cart.group });
      } else if (ui.pick && ui.pick.kind==='seat'){
        const p2 = ui.pick;
        const cart2 = Object.assign({ seats:[], group:'a' }, dayCfg(d).carts[p2.ck]||{});
        const s2 = arr(cart2.seats).slice();
        const tmp = seats[sIdx];
        seats[sIdx] = s2[p2.s]; s2[p2.s] = tmp;
        ui.pick = null;
        op(`days/${d}/carts/${ck}`, { seats: seats.filter(Boolean), group: cart.group });
        if (p2.ck !== ck) op(`days/${d}/carts/${p2.ck}`, { seats: s2.filter(Boolean), group: cart2.group });
      } else if (seats[sIdx]){
        ui.pick = { kind:'seat', ck, s:sIdx, pid: seats[sIdx] };
      }
      requestRender(); break;
    }
    case 'bench': ui.pick = (ui.pick && ui.pick.pid===a.p) ? null : { kind:'bench', pid:a.p }; requestRender(); break;
    case 'cartgroup': {
      const dc = dayCfg(a.d);
      const cart = Object.assign({ seats:[], group:'a' }, dc.carts[a.ck]||{});
      op(`days/${a.d}/carts/${a.ck}`, { seats:arr(cart.seats).filter(Boolean), group: cart.group==='a'?'b':'a' }); break;
    }
    case 'ridepartner': ridePartner(a.d); break;
    case 'mixitup': mixItUp(a.d); break;
    case 'makematches': makeMatches(a.d); break;
    case 'odd-a': {
      closeSheet();
      const d = a.d;
      const dc = dayCfg(d);
      const leftovers = presentIds(d).filter(pid=>!cupMatchesFor(d).some(m=>sideIds(m,'A').includes(pid)||sideIds(m,'B').includes(pid)));
      const reds = leftovers.filter(pid=>effTeam(d,pid)==='red');
      const blues = leftovers.filter(pid=>effTeam(d,pid)==='blue');
      if (reds.length && blues.length)
        op('matches/m'+uid(), { day:d, group:'b', ord: matchesFor(d).length, red:reds.slice(0,2), blue:blues.slice(0,2), holes:{} });
      break;
    }
    case 'odd-b': closeSheet(); toastSnack('Odd man rides — he’s in the tee group, out of the matches.'); break;
    case 'addmatch': op('matches/m'+uid(), { day:a.d, group:'a', ord: matchesFor(a.d).length, red:[], blue:[], holes:{} }); break;
    case 'addsidebet': op('matches/sb'+uid(), { day:a.d, side:true, group:'a', ord: 90+sideBetsFor(a.d).length, red:[], blue:[], holes:{} }); break;
    case 'delmatch': {
      const m = theMatch(a.mid);
      const scored = m && Object.values(m.holes||{}).some(h=>h&&h.winner);
      if (!scored || window.confirm('This match has scored holes. Delete it anyway?')) op('matches/'+a.mid, null);
      break;
    }
    case 'slot': openSheet('pickplayer', { mid:a.mid, side:a.side, old:a.p||'' }); break;
    case 'pickplayer2': {
      const m = theMatch(a.mid); if (!m) break;
      const key = a.side==='A'?'red':'blue';
      let arr = sideIds(m, a.side).slice();
      if (a.old) arr = arr.filter(x=>x!==a.old);
      if (a.p && !arr.includes(a.p)) arr.push(a.p);
      // remove the new player from any other side/match on this day
      if (a.p && !m.side){
        for (const other of cupMatchesFor(m.day)){
          for (const sd of ['A','B']){
            if (other.id===m.id && sd===a.side) continue;
            const ids = sideIds(other, sd);
            if (ids.includes(a.p)) op(`matches/${other.id}/${sd==='A'?'red':'blue'}`, ids.filter(x=>x!==a.p));
          }
        }
      }
      op(`matches/${a.mid}/${key}`, arr.slice(0, m.side ? 1 : 2));
      closeSheet(); break;
    }

    // settings
    case 'emoji': openSheet('emoji', { pid:a.p }); break;
    case 'emoji2': op(`players/${a.p}/emoji`, a.e); closeSheet(); break;
    case 'addplayer': {
      const ps = players();
      const used = new Set(ps.map(p=>p.emoji));
      const em = EMOJIS.find(e=>!used.has(e)) || '🎱';
      op(`players/p${uid()}`, { name:'', emoji:em, hcp:null, ord: ps.length ? Math.max(...ps.map(p=>p.ord||0))+1 : 0 });
      break;
    }
    case 'delplayer': if (window.confirm('Remove this player from the trip?')) op(`players/${a.p}`, null); break;
    case 'usual': {
      const cur = (S.usualTeams||{})[a.p];
      op(`usualTeams/${a.p}`, cur==='red' ? 'blue' : cur==='blue' ? null : 'red'); break;
    }
    case 'flipforit': {
      const ids = namedPlayers().map(p=>p.id);
      const shuffled = ids.slice().sort(()=>Math.random()-0.5);
      shuffled.forEach((pid,i)=> op(`usualTeams/${pid}`, i < Math.ceil(shuffled.length/2) ? 'red':'blue'));
      break;
    }
    case 'holder': op('config/holder', a.v || null);
      if (a.v && cfg().tieRule==='chip') op('config/tieRule','holder');
      if (!a.v && cfg().tieRule==='holder') op('config/tieRule','chip');
      break;
    case 'tierule': op('config/tieRule', a.v); break;
    case 'gimme': op('config/gimme', a.v); break;
    case 'masternet': confirmForward(()=>op('config/net', !cfg().net)); break;
    case 'flat100': op('config/flat100', !cfg().flat100); break;
    case 'resetwhs': op('config/allowances', Object.assign({}, WHS_DEFAULTS)); op('config/flat100', false); break;
    case 'netswitch': LS.set('netsug', true); if (a.v==='1') op('config/net', true); requestRender(); break;
    case 'junkon': op('config/junk', !cfg().junk); break;
    case 'junktype': op(`config/junkTypes/${a.v}`, !(cfg().junkTypes||{})[a.v]); break;
    case 'skinson': op('config/skins', !cfg().skins); break;
    case 'skinsnet': op('config/skinsNet', a.v==='1'); break;
    case 'skinscarry': op('config/skinsCarry', !cfg().skinsCarry); break;
    case 'theme': LS.set('theme', a.v); applyTheme(); requestRender(); break;
    case 'copylink': {
      const link = location.origin + location.pathname + '?db=' + encodeURIComponent(dbUrl());
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(
        ()=>toastSnack('Link copied. Paste it in the chat.'),
        ()=>window.prompt('Copy the trip link:', link));
      break;
    }
    case 'exportjson': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
      const aEl = document.createElement('a');
      aEl.href = URL.createObjectURL(blob); aEl.download = 'no-gimmes-trip.json'; aEl.click();
      break;
    }
    case 'resetscores': openSheet('confirmtext', { title:'Reset all scores', body:'Every hole result and stroke on every day gets wiped. Setup stays.', act:'resetscores2' }); break;
    case 'resetscores2': {
      const f = document.getElementById('confirmfield');
      if (f && f.value.trim() === cfg().tripName){
        for (const m of allMatches()){ op(`matches/${m.id}/holes`, null); op(`matches/${m.id}/concededBy`, null); op(`matches/${m.id}/concededAt`, null); }
        op('junk', null);
        closeSheet(); toastSnack('Clean card. Play well.');
      } else toastSnack('Type the trip name exactly to confirm.');
      break;
    }
    case 'resettrip': openSheet('confirmtext', { title:'Reset the entire trip', body:'Players, days, matches, everything.', act:'resettrip2' }); break;
    case 'resettrip2': {
      const f = document.getElementById('confirmfield');
      if (f && f.value.trim() === cfg().tripName){
        op('', null); closeSheet(); navigate('#/'); requestRender();
      } else toastSnack('Type the trip name exactly to confirm.');
      break;
    }
  }
});
function confirmForward(fn){
  if (allMatches().some(m=>Object.values(m.holes||{}).some(h=>h&&h.winner))){
    if (window.confirm('Nothing already posted gets re-scored. New holes use it.')) fn();
  } else fn();
}

// inputs
document.addEventListener('change', (ev)=>{
  const el = ev.target.closest('[data-input]');
  if (!el) return;
  const a = el.dataset, v = el.value;
  switch(a.input){
    case 'pname': op(`players/${a.p}/name`, v.trim()); break;
    case 'phcp': op(`players/${a.p}/hcp`, v==='' ? null : +v); break;
    case 'time': op(`days/${a.d}/times/${a.g}`, v || '08:00'); break;
    case 'customname': {
      const cst = Object.assign({ name:'', pars:Array(18).fill(4), sis:[] }, dayCfg(a.d).custom||{});
      cst.name = v; op(`days/${a.d}/custom`, cst); break;
    }
    case 'mixname': if ((S.mixes||{})[a.id]) op(`mixes/${a.id}/name`, v.trim().slice(0,24)); break;
    case 'tripname': op('config/tripName', v.trim() || 'No Gimmes 2026'); break;
    case 'tname': op(`config/teamNames/${a.t}`, (v.trim() || (a.t==='red'?'RED':'BLUE')).toUpperCase().slice(0,8)); break;
    case 'allow': op(`config/allowances/${a.k}`, Math.max(0, Math.min(200, +v||0))); break;
    case 'strokecap': op('config/strokeCap', Math.max(0, +v|0)); break;
    case 'dburl': LS.set('db', v.trim()); sse.es && sse.es.close(); sse.es=null; sseConnect(); scheduleFlush(); requestRender(); break;
    case 'holenote': ui.noteEdit = null; op(`notes/${a.c}/${a.hn}`, v.trim().slice(0,90) || null); break;
  }
});

// swipe between matches (match header area only)
let swipeX = null, swipeY = null;
document.addEventListener('touchstart', (ev)=>{
  const t = ev.target.closest('[data-swipe]');
  swipeX = t ? ev.touches[0].clientX : null;
  swipeY = t ? ev.touches[0].clientY : null;
}, { passive:true });
document.addEventListener('touchend', (ev)=>{
  if (swipeX==null || ui.screen!=='match') return;
  const dx = ev.changedTouches[0].clientX - swipeX;
  const dy = ev.changedTouches[0].clientY - swipeY;
  swipeX = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
  const ms = matchesFor(theMatch(ui.matchId).day);
  const i = ms.findIndex(m=>m.id===ui.matchId);
  const nx = dx < 0 ? ms[i+1] : ms[i-1];
  if (nx) navigate('#/match/'+nx.id);
}, { passive:true });

// ---- landing & boot --------------------------------------------------------
function landHome(fromWho){
  const me = LS.get('id', null);
  const d = resolveDay();
  ui.day = d;
  if (me && me!=='watch' && (isToday(d) || tripOver()===false)){
    const landable = [...cupMatchesFor(d), ...sideBetsFor(d)];
    for (const m of landable){
      if (!isToday(d)) break;
      const mine = sideIds(m,'A').includes(me) || sideIds(m,'B').includes(me);
      if (!mine) continue;
      const dr = mDer(m);
      const started = dr.st.thru > 0 || teedOff(m);
      if (!dr.st.done && started){ navigate('#/match/'+m.id); return; }
    }
  }
  navigate('#/day/'+d);
  if (tripOver() && !LS.get('finalseen', false) && allMatches().length){ LS.set('finalseen', true); setTimeout(()=>openSheet('cup'), 400); }
}
function teedOff(m){
  const dc = dayCfg(m.day);
  if (!isToday(m.day)) return false;
  const t = (dc.times||{})[m.group||'a'];
  if (!t) return false;
  const now = new Date();
  const [h,mn] = t.split(':').map(Number);
  return now.getHours()*60+now.getMinutes() >= h*60+mn;
}
function applyTheme(){
  const t = LS.get('theme','auto');
  if (t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}

(function boot(){
  // ?db= handoff
  try {
    const u = new URL(location.href);
    const db = u.searchParams.get('db');
    if (db){ LS.set('db', db.replace(/\/+$/,'')); u.searchParams.delete('db'); history.replaceState(null,'',u.pathname+(u.search||'')+u.hash); }
  } catch(e){}
  applyTheme();
  // re-apply any queued ops over the cached tree (they may not have flushed)
  for (const o of pend) applyPath(o.path, o.value);
  ui.day = LS.get('day', null) || resolveDay();
  if (location.hash && location.hash !== '#/' && location.hash !== '#') parseRoute();
  else if (rosterReady()) landHome();
  render();
  sseConnect();
  scheduleFlush();
  document.addEventListener('visibilitychange', ()=>{
    if (!document.hidden){
      if (!sse.es) sseConnect();
      scheduleFlush();
      requestRender();
    }
  });
  window.addEventListener('online', ()=>scheduleFlush());
})();
/* ===END APP=== */

</script>
